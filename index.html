<!DOCTYPE html>
<html lang="lt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#040404">
<meta name="description" content="Studio AI — mokymosi platforma su šešiais AI korepetitoriais, nuotraukų sprendimu ir kalbančiu robotu.">
<title>Studio AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://openrouter.ai" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--pill:999px;--sb:288px;--sbc:76px;
--ease:cubic-bezier(.4,0,.2,1);--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--fast:.12s;--dur:.18s;--slow:.28s;--max:860px;
--accent:#fff;--accent-rgb:255,255,255;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
:root[data-theme=dark]{--bg:#040404;--elev:#0a0a0a;--panel:#0d0d0d;--surface:#161616;--line:#1e1e1e;--line2:#2a2a2a;--text:#fafafa;--text2:#a3a3a3;--muted:#737373;--muted2:#525252;--hover:#161616;--active:#1e1e1e;--overlay:rgba(0,0,0,.82);--shadow:0 24px 70px rgba(0,0,0,.7);--glass:rgba(10,10,10,.8);--ai:#0f0f0f;--ai-b:#1e1e1e;--u-bg:#fafafa;--u-tx:#050505;--code:#000;--send:#fafafa;--send-t:#050505}
:root[data-theme=light]{--bg:#fafafa;--elev:#fff;--panel:#fff;--surface:#f0f0f0;--line:#e5e5e5;--line2:#d4d4d4;--text:#0a0a0a;--text2:#525252;--muted:#737373;--muted2:#a3a3a3;--hover:#f0f0f0;--active:#e5e5e5;--overlay:rgba(0,0,0,.35);--shadow:0 20px 60px rgba(0,0,0,.15);--glass:rgba(255,255,255,.82);--ai:#fff;--ai-b:#e5e5e5;--u-bg:#0a0a0a;--u-tx:#fafafa;--code:#0a0a0a;--send:#0a0a0a;--send-t:#fafafa}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:14.5px;line-height:1.55;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit}svg{display:block;flex-shrink:0}img{max-width:100%}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:var(--pill)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.paused .robot *,.paused .msg *{animation-play-state:paused!important}

.app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);height:100vh;height:100dvh;transition:grid-template-columns var(--dur) var(--ease);overflow:hidden;background:radial-gradient(1200px 600px at 0 0,rgba(var(--accent-rgb),.035),transparent 60%),var(--bg)}
.app.sidebar-collapsed{grid-template-columns:var(--sbc) minmax(0,1fr)}
.sidebar{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0;min-height:0;overflow:hidden;z-index:30;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left)}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-bottom:1px solid var(--line);min-height:64px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;flex:1}
.brand-logo{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:var(--text);color:var(--bg)}
.brand-text{display:flex;flex-direction:column;white-space:nowrap}
.brand-text b{font-size:14.5px;font-weight:700}
.brand-text span{font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.sidebar-collapse{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.sidebar-collapse:hover{background:var(--hover);color:var(--text)}
.app.sidebar-collapsed .sidebar-collapse svg{transform:rotate(180deg)}
.app.sidebar-collapsed .brand-text{display:none}
.app.sidebar-collapsed .sidebar-header{flex-direction:column;justify-content:center;padding:14px 8px}
.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 0;display:flex;flex-direction:column;gap:4px;min-height:0;overscroll-behavior:contain}
.sec-label{padding:12px 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);white-space:nowrap}
.app.sidebar-collapsed .sec-label{opacity:0;height:16px;padding:4px 0;overflow:hidden}
.model-list{display:flex;flex-direction:column;gap:4px}
.model-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-md);border:1px solid transparent;text-align:left;width:100%;min-height:48px;position:relative;transition:background var(--fast),transform var(--dur) var(--out)}
.model-item:hover{background:var(--hover);transform:translateX(2px)}
.model-item.active{background:rgba(var(--m),.1);border-color:rgba(var(--m),.25)}
.model-avatar{width:32px;height:32px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.model-avatar.lg{width:36px;height:36px;font-size:14px}
.model-info{display:flex;flex-direction:column;min-width:0;flex:1}
.model-info b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-info span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.sidebar-collapsed .model-info{display:none}
.app.sidebar-collapsed .model-item{justify-content:center;padding:10px 0}
.chat-actions{display:flex;gap:6px;padding:2px 4px 8px}
.search-box{position:relative;flex:1}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box input{width:100%;height:34px;padding:0 10px 0 32px;background:var(--elev);border:1px solid var(--line);border-radius:var(--r-sm);font-size:12.5px}
.search-box input:focus{outline:0;border-color:var(--text2)}
.btn-new-chat{height:34px;width:34px;flex-shrink:0;border-radius:var(--r-sm);background:var(--elev);border:1px solid var(--line);color:var(--text2);display:grid;place-items:center}
.btn-new-chat:hover{background:var(--text);color:var(--bg)}
.chat-list{display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.chat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);color:var(--text2);cursor:pointer;font-size:13px;min-height:38px}
.chat-item:hover{background:var(--hover);color:var(--text)}
.chat-item.active{background:var(--active);color:var(--text)}
.chat-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chat-menu-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.chat-item:hover .chat-menu-btn,.chat-item.active .chat-menu-btn,.chat-menu-btn:focus-visible{opacity:1}
@media (hover:none){.chat-menu-btn{opacity:1}}
.chat-menu-btn:hover{background:var(--line2);color:var(--text)}
.app.sidebar-collapsed .chat-list,.app.sidebar-collapsed .chat-actions{display:none}
.chat-empty{padding:20px 12px;font-size:12.5px;color:var(--muted2);text-align:center}
.sidebar-footer{padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sf-btn{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-md);color:var(--text2);font-size:13px;font-weight:500;width:100%;min-height:40px}
.sf-btn:hover{background:var(--hover);color:var(--text)}
.app.sidebar-collapsed .sf-btn{justify-content:center}.app.sidebar-collapsed .sf-btn span{display:none}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;padding-top:max(12px,env(safe-area-inset-top));padding-right:max(22px,env(safe-area-inset-right));border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex-shrink:0;min-height:64px;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.mobile-menu-btn{display:none;width:40px;height:40px;border-radius:var(--r-sm);color:var(--text2);align-items:center;justify-content:center;margin-left:-8px}
.topbar-model{display:flex;align-items:center;gap:11px;min-width:0}
.topbar-model-info{min-width:0}
.topbar-model-info b{font-size:14.5px;font-weight:600;white-space:nowrap}
.tm-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(34,197,94,.5);flex-shrink:0}
.topbar-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--pill);font-size:11.5px;font-weight:500;color:var(--text2);background:var(--elev);border:1px solid var(--line);white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text2)}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* ================= ROBOTAS ================= */
.voice-stage{display:none;flex-shrink:0;flex-direction:column;align-items:center;gap:6px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:radial-gradient(560px 220px at 50% 0,rgba(var(--accent-rgb),.16),transparent 72%);--lx:0;--ly:0;--mouth:0;position:relative;overflow:hidden}
.voice-stage.on{display:flex}
.robot-wrap{position:relative;width:clamp(104px,23vh,188px);aspect-ratio:160/176;cursor:pointer;user-select:none;-webkit-user-select:none}
.robot-wrap::before{content:'';position:absolute;inset:14% 8% 10%;border-radius:50%;background:rgba(var(--accent-rgb),.22);filter:blur(26px);opacity:.35;transition:opacity .4s}
.voice-stage[data-state=listening] .robot-wrap::before,.voice-stage[data-state=speaking] .robot-wrap::before{opacity:.9;animation:halo 1.4s ease-in-out infinite}
.voice-stage[data-state=thinking] .robot-wrap::before{opacity:.6;animation:halo 2.2s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.14)}}
.robot{position:relative;width:100%;height:100%;overflow:visible;color:var(--text)}
.rb-body{animation:float 4.2s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 4.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes shadow{50%{transform:scale(.82);opacity:.06}}
.antg{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.ant{fill:rgb(var(--accent-rgb));filter:drop-shadow(0 0 5px rgb(var(--accent-rgb)))}
.ear{transform-box:fill-box;transform-origin:center;transition:transform .3s var(--spring)}
.head{transition:transform .3s var(--spring);transform-box:fill-box;transform-origin:50% 100%}
.screen{fill:#08080d}
.torso{transform-box:fill-box;transform-origin:50% 0;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.04)}}
.chest{fill:rgb(var(--accent-rgb));animation:chest 2.4s ease-in-out infinite;filter:drop-shadow(0 0 4px rgb(var(--accent-rgb)))}
@keyframes chest{50%{opacity:.4}}
.arm{transform-box:fill-box;transform-origin:50% 8%;transition:transform .35s var(--spring)}
.armL{transform:rotate(4deg)}.armR{transform:rotate(-4deg)}
.eyeset{transform:translate(calc(var(--lx,0)*1px),calc(var(--ly,0)*1px));transition:transform .18s ease-out}
.eye{transform-box:fill-box;transform-origin:center;transition:transform .3s var(--spring)}
.eye .ball{fill:rgb(var(--accent-rgb));filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.9))}
.eye .ball,.eye .shine{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite;transition:opacity .2s}
.eye.r .ball,.eye.r .shine{animation-delay:.04s}
.eye .happy{fill:none;stroke:rgb(var(--accent-rgb));stroke-width:4.6;stroke-linecap:round;opacity:0;transition:opacity .2s;filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.9))}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.brow{fill:none;stroke:rgb(var(--accent-rgb));stroke-width:3.4;stroke-linecap:round;opacity:.75;transform-box:fill-box;transform-origin:center;transition:transform .3s var(--spring)}
.cheek{fill:#fb7185;opacity:0;transition:opacity .3s;filter:blur(1px)}
.mouth>*{opacity:0;transition:opacity .15s;fill:none;stroke:rgb(var(--accent-rgb));stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.mouth .m-smile{opacity:1}
.mouth .m-grin,.mouth .m-talk{fill:rgb(var(--accent-rgb));stroke:none}
.m-talk{transform:scaleY(calc(.2 + var(--mouth)*1.5))}
.fx{opacity:0;transition:opacity .3s;fill:rgb(var(--accent-rgb));font-family:var(--font-sans)}
.fx-q,.fx-e{font-size:24px;font-weight:800;transform-box:fill-box;transform-origin:center}
.sp{transform-box:fill-box;transform-origin:center;animation:twinkle 1.1s ease-in-out infinite}
.sp.b{animation-delay:.35s}.sp.c{animation-delay:.7s}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.fx-z text{font-weight:800;animation:zz 2.4s ease-in-out infinite}
.fx-z text:nth-child(2){animation-delay:.8s}
@keyframes zz{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
.fx-h path{fill:#fb7185;transform-box:fill-box;transform-origin:center}
.dots{opacity:0;transition:opacity .2s}
.dots circle{fill:rgb(var(--accent-rgb));transform-box:fill-box;animation:dotp 1s infinite}
.dots circle:nth-child(2){animation-delay:.15s}.dots circle:nth-child(3){animation-delay:.3s}
@keyframes dotp{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
/* nuotaikos */
.voice-stage[data-mood=happy] .eye .ball,.voice-stage[data-mood=happy] .eye .shine{opacity:0}
.voice-stage[data-mood=happy] .eye .happy{opacity:1}
.voice-stage[data-mood=happy] .cheek{opacity:.65}
.voice-stage[data-mood=happy] .brow{transform:translateY(-3px)}
.voice-stage[data-mood=happy] .fx-s{opacity:1}
.voice-stage[data-mood=happy] .m-smile{opacity:0}.voice-stage[data-mood=happy] .m-grin{opacity:1}
.voice-stage[data-mood=curious] .brow.br{transform:translateY(-6px) rotate(-10deg)}
.voice-stage[data-mood=curious] .brow.bl{transform:translateY(1px) rotate(6deg)}
.voice-stage[data-mood=curious] .eye.r{transform:scale(1.25)}
.voice-stage[data-mood=curious] .fx-q{opacity:1;animation:bobq 1.2s ease-in-out infinite}
.voice-stage[data-mood=curious] .m-smile{opacity:0}.voice-stage[data-mood=curious] .m-flat{opacity:1}
.voice-stage[data-mood=curious] .head{transform:rotate(-4deg)}
@keyframes bobq{50%{transform:translateY(-4px) rotate(8deg)}}
.voice-stage[data-mood=surprised] .eye{transform:scale(1.32)}
.voice-stage[data-mood=surprised] .brow{transform:translateY(-8px)}
.voice-stage[data-mood=surprised] .fx-e{opacity:1;animation:pop .5s var(--spring)}
.voice-stage[data-mood=surprised] .m-smile{opacity:0}.voice-stage[data-mood=surprised] .m-o{opacity:1}
.voice-stage[data-mood=surprised] .head{transform:translateY(-3px)}
.voice-stage[data-mood=sad] .brow.bl{transform:translateY(2px) rotate(16deg)}
.voice-stage[data-mood=sad] .brow.br{transform:translateY(2px) rotate(-16deg)}
.voice-stage[data-mood=sad] .eye{transform:scaleY(.85) translateY(2px)}
.voice-stage[data-mood=sad] .m-smile{opacity:0}.voice-stage[data-mood=sad] .m-frown{opacity:1}
.voice-stage[data-mood=sad] .head{transform:translateY(2px) rotate(2deg)}
.voice-stage[data-mood=sad] .antg{animation:none;transform:rotate(18deg)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
/* būsenos */
.voice-stage[data-state=listening] .eye{transform:scale(1.15)}
.voice-stage[data-state=listening] .ear{transform:scaleY(1.2) translateY(-2px)}
.voice-stage[data-state=listening] .antg{animation:sway .5s ease-in-out infinite}
.voice-stage[data-state=listening] .chest{animation-duration:.6s}
.voice-stage[data-state=thinking] .dots{opacity:1}
.voice-stage[data-state=thinking] .eyeset{animation:think 1.6s ease-in-out infinite}
.voice-stage[data-state=thinking] .head{transform:rotate(4deg)}
.voice-stage[data-state=thinking] .m-smile{opacity:0}.voice-stage[data-state=thinking] .m-flat{opacity:1}
.voice-stage[data-state=thinking] .brow.br{transform:translateY(-4px)}
@keyframes think{0%,100%{transform:translate(-3px,-3px)}50%{transform:translate(4px,-4px)}}
.voice-stage[data-state=speaking] .m-smile,.voice-stage[data-state=speaking] .m-grin,.voice-stage[data-state=speaking] .m-flat,.voice-stage[data-state=speaking] .m-o,.voice-stage[data-state=speaking] .m-frown{opacity:0}
.voice-stage[data-state=speaking] .m-talk{opacity:1}
.voice-stage[data-state=speaking].fake .m-talk{animation:talk .24s infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.7)}}
.voice-stage[data-state=speaking] .ear{animation:ear .5s ease-in-out infinite alternate}
@keyframes ear{from{transform:scaleY(1)}to{transform:scaleY(1.15)}}
.voice-stage[data-state=speaking] .chest{animation-duration:.5s}
.voice-stage[data-state=speaking] .armL{animation:gest 1.2s ease-in-out infinite}
.voice-stage[data-state=speaking] .armR{animation:gest 1.2s ease-in-out .6s infinite}
@keyframes gest{50%{transform:rotate(-16deg)}}
.voice-stage[data-state=sleep] .eye .ball,.voice-stage[data-state=sleep] .eye .shine{animation:none;transform:scaleY(.1)}
.voice-stage[data-state=sleep] .fx-z{opacity:1}
.voice-stage[data-state=sleep] .head{transform:rotate(5deg) translateY(2px)}
.voice-stage[data-state=sleep] .antg{animation:none;transform:rotate(14deg)}
.voice-stage[data-state=sleep] .m-smile{opacity:0}.voice-stage[data-state=sleep] .m-flat{opacity:1}
/* mikro veiksmai */
.act-wink .eye.r .ball,.act-wink .eye.r .shine{animation:none;transform:scaleY(.08)}
.act-hop .rb-body{animation:hop .6s var(--spring)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-14px) scale(.98,1.03)}100%{transform:translateY(0)}}
.act-ant .antg{animation:sway .35s ease-in-out 3}
.act-ear .earL{animation:ear .25s ease-in-out 3 alternate}
.wave .armR{animation:wave .45s ease-in-out infinite alternate;transform-origin:50% 8%}
@keyframes wave{from{transform:rotate(-120deg)}to{transform:rotate(-80deg)}}
.giggle .rb-body{animation:giggle .5s ease-in-out 2}
@keyframes giggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-4px)}75%{transform:rotate(4deg) translateY(-4px)}}
.love .fx-h{opacity:1}
.love .fx-h path{animation:heart 1s ease-out forwards}
@keyframes heart{0%{transform:translateY(8px) scale(.3);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) scale(1.2);opacity:0}}
.voice-status{font-size:13px;font-weight:600;min-height:19px;text-align:center}
.voice-caption{font-size:12.5px;color:var(--text2);text-align:center;max-width:min(640px,92%);min-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
.wave-bars{display:none;align-items:center;gap:3px;height:16px}
.voice-stage[data-state=listening] .wave-bars{display:flex}
.wave-bars i{width:3px;height:4px;border-radius:2px;background:rgb(var(--accent-rgb));animation:bar .9s ease-in-out infinite}
.wave-bars i:nth-child(2){animation-delay:.1s}.wave-bars i:nth-child(3){animation-delay:.2s}.wave-bars i:nth-child(4){animation-delay:.3s}.wave-bars i:nth-child(5){animation-delay:.4s}
@keyframes bar{50%{height:16px}}
.voice-controls{display:flex;align-items:center;gap:10px}
.mic-btn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--send);color:var(--send-t);transition:transform var(--fast)}
.mic-btn:hover:not(:disabled){transform:scale(1.07)}
.mic-btn:disabled{opacity:.4;cursor:not-allowed}
.mic-btn.rec{background:#ef4444;color:#fff;animation:recring 1.2s infinite}
@keyframes recring{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}100%{box-shadow:0 0 0 16px rgba(239,68,68,0)}}
.voice-toggle{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:var(--pill);border:1px solid var(--line);background:var(--elev);color:var(--text2);font-size:12px;font-weight:500}
.voice-toggle.off{opacity:.55}

.chat-area{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.chat-inner{max-width:var(--max);margin:0 auto;padding:28px 24px 12px;min-height:100%}
.welcome{padding:10px 0 40px;animation:fadeUp var(--slow) var(--out)}
.welcome-hero{text-align:center;padding:20px 0 32px}
.welcome-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:var(--pill);background:var(--elev);border:1px solid var(--line);color:var(--text2);font-size:11.5px;font-weight:600;margin-bottom:18px}
.welcome-hero h1{font-size:clamp(24px,3.5vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:0 0 12px}
.welcome-hero p{font-size:15px;color:var(--text2);margin:0 auto;max-width:540px}
.w-title{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 14px}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:28px}
.category-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);text-align:left;transition:transform var(--dur) var(--out),border-color var(--dur)}
.category-card:hover{transform:translateY(-4px);border-color:var(--line2)}
.category-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.category-card b{font-size:13.5px;font-weight:600}
.category-card span{font-size:12px;color:var(--muted)}
.quick-list{display:flex;flex-wrap:wrap;gap:8px}
.quick-chip{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line);color:var(--text2);font-size:12.8px;font-weight:500;text-align:left}
.quick-chip:hover{background:var(--text);border-color:var(--text);color:var(--bg)}

.messages{display:flex;flex-direction:column;gap:22px;padding-bottom:16px}
.more-btn{align-self:center;padding:8px 16px;border-radius:var(--pill);border:1px solid var(--line);background:var(--elev);color:var(--text2);font-size:12.5px}
.msg{display:flex;gap:12px;animation:fadeUp var(--slow) var(--out);content-visibility:auto;contain-intrinsic-size:auto 90px}
.msg.streaming,.msg.fresh,.msg.typing{content-visibility:visible}
.msg.user{justify-content:flex-end}
.msg-avatar{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:2px}
.msg.fresh .msg-avatar,.msg.streaming .msg-avatar{animation:pop .5s var(--spring)}
.msg-body{min-width:0;max-width:min(100%,700px);display:flex;flex-direction:column;gap:6px}
.msg.user .msg-body{align-items:flex-end}
.msg-head{display:flex;align-items:center;gap:8px;padding:0 2px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.msg-head b{color:var(--text2);font-weight:600;font-size:12.5px}
.msg-time{font-size:11px;color:var(--muted2)}
.lvl-tag{padding:1px 8px;border-radius:var(--pill);background:rgba(var(--accent-rgb),.14);color:var(--text);font-size:10.5px;font-weight:600}
.msg-content{font-size:14.5px;line-height:1.68;overflow-wrap:anywhere}
.msg.user .msg-content{background:var(--u-bg);color:var(--u-tx);padding:11px 16px;border-radius:16px 16px 4px 16px;max-width:100%;white-space:pre-wrap}
.msg.ai .msg-content{background:var(--ai);border:1px solid var(--ai-b);border-radius:4px 16px 16px 16px;padding:12px 16px;transition:border-color .3s,box-shadow .3s}
.msg-imgs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.msg-imgs img{width:112px;height:112px;object-fit:cover;border-radius:12px;border:1px solid var(--line2)}
.msg.ai.streaming .msg-content{border-color:rgba(var(--accent-rgb),.55);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08),0 0 24px rgba(var(--accent-rgb),.12);animation:streamglow 1.6s ease-in-out infinite}
@keyframes streamglow{50%{box-shadow:0 0 0 5px rgba(var(--accent-rgb),.14),0 0 34px rgba(var(--accent-rgb),.22)}}
.msg.ai.fresh .msg-content{animation:done .9s var(--out)}
@keyframes done{0%{border-color:rgba(var(--accent-rgb),.9);box-shadow:0 0 0 0 rgba(var(--accent-rgb),.5)}100%{border-color:var(--ai-b);box-shadow:0 0 0 14px rgba(var(--accent-rgb),0)}}
.msg-actions{display:flex;gap:2px;opacity:.0;transition:opacity var(--fast);flex-wrap:wrap}
.msg:hover .msg-actions,.msg:focus-within .msg-actions,.msg-actions.show{opacity:1}
@media (hover:none){.msg-actions{opacity:1}}
.msg-action{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:7px;font-size:11.5px;color:var(--muted)}
.msg-action:hover{background:var(--hover);color:var(--text)}
.msg-action.reading{color:rgb(var(--accent-rgb));background:rgba(var(--accent-rgb),.12)}
.stream-cursor{display:inline-block;width:7px;height:1em;background:rgb(var(--accent-rgb));margin-left:2px;vertical-align:text-bottom;border-radius:2px;animation:cur 1s steps(2) infinite}
@keyframes cur{50%{opacity:0}}
.typing .msg-content{display:inline-flex;gap:5px;align-items:center;padding:14px 18px}
.typing i{width:6px;height:6px;border-radius:50%;background:rgb(var(--accent-rgb));animation:bounce 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.msg.ai .msg-content p{margin:0 0 10px}.msg.ai .msg-content p:last-child{margin-bottom:0}
.msg.ai .msg-content :is(h2,h3,h4,h5){margin:16px 0 8px;font-weight:700;line-height:1.3}
.msg.ai .msg-content :is(h2,h3,h4,h5):first-child{margin-top:0}
.msg.ai .msg-content :is(ul,ol){margin:6px 0 10px;padding-left:22px}
.msg.ai .msg-content li{margin:3px 0}
.msg.ai .msg-content blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--text2);background:var(--surface);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--text2)}
.msg.ai .msg-content blockquote p{margin:0}
.msg.ai .msg-content hr{border:0;height:1px;background:var(--line);margin:14px 0}
.msg.ai .msg-content a{text-decoration:underline;text-underline-offset:2px}
.tbl-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:var(--r-sm)}
.tbl-wrap table{border-collapse:collapse;width:100%;font-size:13px}
.tbl-wrap th,.tbl-wrap td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl-wrap th{background:var(--surface);font-weight:600}
.tbl-wrap tr:last-child td{border-bottom:0}
.inline-code{font-family:var(--font-mono);font-size:.87em;padding:2px 6px;background:var(--surface);border:1px solid var(--line);border-radius:5px}
.math-inline{font-family:var(--font-mono);font-size:.93em;padding:1px 6px;background:var(--surface);border-radius:5px;white-space:nowrap}
.math-block{display:block;padding:14px 18px;margin:12px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font-family:var(--font-mono);line-height:1.85;white-space:pre-wrap;overflow-x:auto}
/* KODAS */
.code-block{margin:12px 0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--code)}
.code-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px 5px 12px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.07)}
.code-lang{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8f93b5;font-family:var(--font-mono)}
.code-actions{display:flex;gap:2px}
.code-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:6px;font-size:11px;color:#8f93b5}
.code-btn:hover{background:rgba(255,255,255,.09);color:#e8e9f3}
.code-btn.done{color:#4ade80}
.code-block pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--font-mono);font-size:12.8px;line-height:1.65;color:#e6e6ef;-webkit-overflow-scrolling:touch;tab-size:2}
.tk-c{color:#6b7280;font-style:italic}.tk-s{color:#a5e075}.tk-n{color:#f0a869}.tk-k{color:#c792ea}.tk-b{color:#82aaff}.tk-f{color:#7fdbca}.tk-t{color:#ffcb6b}.tk-o{color:#89ddff}.tk-a{color:#f78c6c}.tk-g{color:#ff5370}
/* PRIEDAI, ĮRANKIAI */
.composer{padding:8px 22px 14px;padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));padding-bottom:max(14px,env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);flex-shrink:0}
.composer-inner{max-width:var(--max);margin:0 auto}
.tray{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.att{position:relative;flex-shrink:0;width:76px;height:76px;border-radius:12px;overflow:hidden;border:2px solid var(--line2);background:var(--surface)}
.att img{width:100%;height:100%;object-fit:cover}
.att.q-ok{border-color:var(--ok)}.att.q-warn{border-color:var(--warn)}.att.q-bad{border-color:var(--bad)}
.att .qb{position:absolute;left:4px;bottom:4px;padding:1px 6px;border-radius:var(--pill);font-size:10px;font-weight:700;color:#fff;background:var(--ok)}
.att.q-warn .qb{background:var(--warn)}.att.q-bad .qb{background:var(--bad)}
.att .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.att.busy::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45) center/24px no-repeat;animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.5}}
.q-note{font-size:11.5px;line-height:1.4;padding:7px 10px;border-radius:10px;margin-bottom:8px;border:1px solid;display:flex;gap:8px;align-items:flex-start}
.q-note.warn{color:var(--warn);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.q-note.bad{color:var(--bad);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.doc-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;height:76px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-size:12px;max-width:240px}
.doc-chip b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.doc-chip span{color:var(--muted);font-size:11px}
.doc-chip button{color:var(--muted);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.doc-chip button:hover{background:var(--hover);color:var(--text)}
.tools{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool-btn{width:38px;height:38px;flex-shrink:0;border-radius:11px;border:1px solid var(--line);background:var(--elev);color:var(--text2);display:grid;place-items:center}
.tool-btn:hover{background:var(--hover);color:var(--text)}
.tool-btn.cam{display:none}
@media (hover:none){.tool-btn.cam{display:grid}}
.tool-sep{width:1px;height:20px;background:var(--line);flex-shrink:0}
.seg{display:inline-flex;flex-shrink:0;background:var(--elev);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;min-height:30px}
.seg button.active{background:var(--text);color:var(--bg)}
.soc-info{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:12px;color:var(--text2);white-space:nowrap}
.soc-info button{padding:6px 11px;border-radius:var(--pill);border:1px solid var(--line2);font-size:12px;color:var(--text);background:var(--elev)}
.soc-info button:hover{background:var(--text);color:var(--bg)}
.input-shell{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px;background:var(--elev);border:1.5px solid var(--line);border-radius:18px}
.input-shell:focus-within{border-color:var(--text2);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.08)}
.input-shell textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;line-height:1.5;padding:8px 0;max-height:200px}
.input-shell textarea::placeholder{color:var(--muted2)}
.clear-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);align-self:center;opacity:0;pointer-events:none}
.clear-btn.visible{opacity:1;pointer-events:auto}
.clear-btn:hover{background:var(--hover);color:var(--text)}
.send-btn{width:42px;height:42px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;background:var(--send);color:var(--send-t);transition:transform var(--fast),opacity var(--fast),border-radius .25s var(--ease)}
.send-btn:hover:not(:disabled){transform:scale(1.07)}
.send-btn:active:not(:disabled){transform:scale(.94)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.send-btn .ico-stop{display:none}
.send-btn.busy{border-radius:50%;animation:sendring 1.3s ease-out infinite}
.send-btn.busy .ico-send{display:none}
.send-btn.busy .ico-stop{display:block;animation:stoppulse 1.3s ease-in-out infinite}
@keyframes sendring{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.55)}100%{box-shadow:0 0 0 12px rgba(var(--accent-rgb),0)}}
@keyframes stoppulse{50%{transform:scale(.8)}}
.input-hint{display:flex;justify-content:space-between;gap:12px;padding:8px 6px 0;font-size:11px;color:var(--muted2)}
.input-hint kbd{padding:1px 5px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:10px;font-weight:600;color:var(--muted)}
.drop-hint{position:absolute;inset:8px;z-index:40;border:2px dashed rgb(var(--accent-rgb));border-radius:20px;background:var(--overlay);display:none;place-items:center;font-weight:600;font-size:16px;pointer-events:none}
.drop-hint.on{display:grid}
/* PATIKRINIMAS (QUIZ) */
.quiz-offer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed rgba(var(--accent-rgb),.5);border-radius:14px;background:rgba(var(--accent-rgb),.06);font-size:13px}
.quiz-offer button{padding:7px 14px;border-radius:var(--pill);background:var(--text);color:var(--bg);font-weight:600;font-size:12.5px}
.quiz{border:1px solid var(--ai-b);background:var(--ai);border-radius:4px 18px 18px 18px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;width:min(100%,700px)}
.quiz h4{margin:0;font-size:14.5px}
.quiz .qq{font-weight:600;margin-bottom:8px}
.quiz .opts{display:flex;flex-direction:column;gap:6px}
.quiz .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line2);background:var(--elev);min-height:44px;transition:border-color .15s,background .15s}
.quiz .opt:hover:not(:disabled){border-color:rgb(var(--accent-rgb))}
.quiz .opt.right{border-color:var(--ok);background:rgba(34,197,94,.12)}
.quiz .opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.12)}
.quiz .opt:disabled{cursor:default}
.quiz .expl{font-size:12.5px;color:var(--text2);margin-top:6px}
.quiz textarea{width:100%;min-height:78px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line2);background:var(--elev);resize:vertical;font-size:14px}
.quiz .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quiz .qbtn{padding:9px 16px;border-radius:var(--pill);background:var(--text);color:var(--bg);font-weight:600;font-size:13px}
.quiz .qbtn.ghost{background:var(--surface);color:var(--text2);border:1px solid var(--line2)}
.quiz .qbtn:disabled{opacity:.5}
.quiz .score{display:flex;gap:10px;flex-wrap:wrap}
.quiz .score div{flex:1;min-width:110px;padding:10px 12px;border-radius:12px;background:var(--surface);text-align:center}
.quiz .score b{display:block;font-size:20px}
.quiz .score span{font-size:11.5px;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid rgba(245,158,11,.5);background:rgba(245,158,11,.09);font-size:13px;margin-top:2px}
.notice button{margin-top:8px;padding:8px 14px;border-radius:var(--pill);background:var(--text);color:var(--bg);font-weight:600;font-size:12.5px}
/* PROGRESAS */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{padding:12px;border-radius:12px;background:var(--surface);text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:7px 0}
.bar-row .nm{width:74px;flex-shrink:0}
.bar-row .bar{flex:1;height:8px;border-radius:var(--pill);background:var(--surface);overflow:hidden}
.bar-row .bar i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--text));transition:width .6s var(--out)}
.bar-row .pc{width:42px;text-align:right;color:var(--text2)}
.hist{font-size:12.5px;color:var(--text2);display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
/* KITA */
.speak-pill{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:12.5px;font-weight:500}
.speak-pill.on{display:flex;animation:fadeUp .25s var(--out)}
.speak-pill .bars{display:flex;gap:2px;align-items:center;height:14px}
.speak-pill .bars i{width:3px;height:4px;border-radius:2px;background:rgb(var(--accent-rgb));animation:bar .8s ease-in-out infinite}
.speak-pill .bars i:nth-child(2){animation-delay:.15s}.speak-pill .bars i:nth-child(3){animation-delay:.3s}
.speak-pill button{width:30px;height:30px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.toasts{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line2);font-size:13px;font-weight:500;box-shadow:var(--shadow);opacity:0;transform:translateY(14px);transition:opacity var(--dur),transform var(--dur)}
.toast.show{opacity:1;transform:none}
.toast.success svg{color:var(--ok)}.toast.error svg{color:var(--bad)}
.modal-backdrop{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);z-index:150;display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;margin:auto;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;animation:fadeUp var(--slow) var(--out)}
.modal-head{padding:20px 22px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-head h2{font-size:16px;font-weight:700;margin:0}
.modal-head p{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.modal-close{width:34px;height:34px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.modal-close:hover{background:var(--hover);color:var(--text)}
.modal-body{padding:16px 22px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-foot{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;white-space:nowrap;min-height:40px}

function parseAI(raw) {
  let t = String(raw || ''), mood = null, bad = null;
  t = t.replace(/^\s*\[mood:\s*(\w+)\s*\]\s*/i, (m, g) => { mood = g.toLowerCase(); return ''; });
  t = t.replace(/\[\[BAD_IMAGE:?\s*([^\]]*)\]\]\s*/i, (m, g) => { bad = (g || '').trim() || 'neįskaitoma'; return ''; });
  if (/^\s*\[[^\]]{0,24}$/.test(t)) t = '';

}
const MOODS = ['happy', 'curious', 'surprised', 'sad', 'neutral'];
function detectMood(text) {
  const t = norm(text);
  if (/(oho|wow|stebuklinga|netiketa|nuostabu|neimanoma|oi!)/.test(t)) return 'surprised';
  if (/(atsiprasau|deja|apmauda|liudn|nepavyko|gaila)/.test(t)) return 'sad';

}

/* ============ 10. API KLIENTAS ============ */
function userAbortError() { const e = new Error('Nutraukta'); e.userAbort = true; return e; }
async function readError(res, name) {
  let detail = '';
  try { const j = await res.json(); detail = j?.error?.message || JSON.stringify(j); } catch { try { detail = await res.text(); } catch {} }
  let hint = '';
  if (res.status === 401 || res.status === 403) hint = ' (patikrink API raktą Nustatymuose)';
  else if (res.status === 429) hint = ' (per daug užklausų, palauk)';
  else if (/image|vision|multimodal/i.test(detail)) hint = ' (pasirink modelį su nuotraukų palaikymu Nustatymuose → Vision modelis)';
  return new Error(`${name} ${res.status}: ${String(detail).slice(0, 220)}${hint}`);
}
function authHeaders() {
  return { 'Authorization': `Bearer ${getApiKey()}`, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin && location.origin !== 'null' ? location.origin : 'https://localhost', 'X-Title': 'Studio AI' };

/* opts: { onToken, signal, maxTokens } — be onToken grąžina visą atsakymą iš karto. */
async function callOpenRouter(messages, modelName, opts = {}) {
  if (!getApiKey()) throw new Error('Trūksta OpenRouter API rakto. Įvesk jį Nustatymuose arba pasirink Demo režimą.');
  const ctrl = new AbortController();
  let userAborted = false;
  if (opts.signal) {
    if (opts.signal.aborted) { userAborted = true; ctrl.abort(); }
    opts.signal.addEventListener('abort', () => { userAborted = true; ctrl.abort(); }, { once: true });
  }
  let timer = setTimeout(() => ctrl.abort(), 70000);
  const bump = () => { clearTimeout(timer); timer = setTimeout(() => ctrl.abort(), 30000); };
  try {
    const res = await fetch(API_BASE + '/chat/completions', {
      method: 'POST', headers: authHeaders(), signal: ctrl.signal,
      body: JSON.stringify({ model: modelName, messages, max_tokens: opts.maxTokens || 1400, temperature: opts.temperature ?? 0.5, stream: !!opts.onToken }),
    });
    if (!res.ok) throw await readError(res, 'OpenRouter');
    bump();
    if (!opts.onToken) {
      const c = (await res.json())?.choices?.[0]?.message?.content;
      if (!c) throw new Error('Tuščias atsakymas iš OpenRouter.');
      return c.trim();
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', full = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      bump();
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        if (payload === '[DONE]') return full;
        let j; try { j = JSON.parse(payload); } catch { continue; }
        if (j?.error) throw new Error(j.error.message || 'Teikėjo klaida');
        const d = j?.choices?.[0]?.delta?.content;
        if (d) { full += d; opts.onToken(d); }
      }
    }
    if (!full.trim()) throw new Error('Tuščias atsakymas iš OpenRouter.');
    return full;
  } catch (err) {
    if (userAborted) throw userAbortError();
    if (err.name === 'AbortError') throw new Error('Užklausa nutraukta (laikas baigėsi).');
    if (err instanceof TypeError) throw new Error('Tinklo klaida. Patikrink interneto ryšį arba CORS.');
    throw err;
  } finally { clearTimeout(timer); }
}
async function callOllama(messages, signal) {

    if (!Array.isArray(m.content)) return m;
    return { role: m.role, content: m.content.filter(p => p.type === 'text').map(p => p.text).join('\n'),
      images: m.content.filter(p => p.type === 'image_url').map(p => p.image_url.url.replace(/^data:[^,]+,/, '')) };
  });

  if (signal) signal.addEventListener('abort', () => { userAborted = true; ctrl.abort(); }, { once: true });
  const timer = setTimeout(() => ctrl.abort(), 120000);
  try {
    const res = await fetch(`${url}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ model: state.settings.ollamaModel, messages: conv, stream:false, options:{temperature:.6} }), signal: ctrl.signal });

/* ============ 15. NUOTRAUKOS: APDOROJIMAS IR KOKYBĖS DETEKTORIUS ============ */
async function loadBitmap(file) {
  if ('createImageBitmap' in window) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {} }
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('format')); };
    i.src = u;
  });
}
function drawScaled(src, w, h, max) {
  const sc = Math.min(1, max / Math.max(w, h)), cw = Math.max(8, Math.round(w * sc)), ch = Math.max(8, Math.round(h * sc));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(src, 0, 0, cw, ch);
  return { c, ctx, cw, ch };
}
/* Aptinka: susiliejimą (Laplaso dispersija), tamsą, persvietimą, mažą kontrastą, mažą raišką. */
function analyzeQuality(src, w, h) {
  const { ctx, cw, ch } = drawScaled(src, w, h, 640);
  const px = ctx.getImageData(0, 0, cw, ch).data, n = cw * ch, g = new Float32Array(n);
  let sum = 0;
  for (let i = 0, j = 0; i < px.length; i += 4, j++) { const v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; g[j] = v; sum += v; }
  const mean = sum / n; let sq = 0;
  for (let j = 0; j < n; j++) { const d = g[j] - mean; sq += d * d; }
  const std = Math.sqrt(sq / n);
  let ls = 0, lq = 0, cnt = 0;
  for (let y = 1; y < ch - 1; y++) for (let x = 1; x < cw - 1; x++) {
    const i = y * cw + x, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - cw] - g[i + cw];
    ls += l; lq += l * l; cnt++;
  }
  const lap = cnt ? lq / cnt - (ls / cnt) ** 2 : 0, minSide = Math.min(w, h);
  const issues = [], tips = []; let level = 'ok';
  const hard = (t, tip) => { level = 'bad'; issues.push(t); tips.push(tip); };
  const soft = (t, tip) => { if (level !== 'bad') level = 'warn'; issues.push(t); tips.push(tip); };
  if (lap < 28) hard('susiliejusi (nefokusuota)', 'laikyk telefoną stabiliai ir palauk, kol sufokusuos');
  else if (lap < 70) soft('šiek tiek susiliejusi', 'pabandyk fotografuoti arčiau ir stabiliau');
  if (mean < 38) hard('per tamsi', 'įjunk daugiau šviesos arba fotografuok prie lango');
  else if (mean < 65) soft('tamsoka', 'pridėk daugiau šviesos');
  if (mean > 238 && std < 30) hard('persvitusi (per šviesi)', 'venk tiesioginės šviesos ir blykstės atspindžių');
  else if (mean > 222) soft('labai šviesi', 'sumažink apšvietimą ar blizgesį');
  if (std < 12) hard('beveik nėra kontrasto', 'pasirūpink, kad tekstas ryškiai išsiskirtų iš fono');
  else if (std < 28) soft('mažas kontrastas', 'fotografuok ant šviesaus, lygaus fono');
  if (minSide < 320) hard('per maža raiška', 'nufotografuok didesnės raiškos nuotrauką');
  else if (minSide < 520) soft('žema raiška', 'priartink arba naudok geresnę kamerą');
  return { level, issues, tips, lap: Math.round(lap), mean: Math.round(mean), std: Math.round(std), w, h };
}
async function processImage(file) {
  const bmp = await loadBitmap(file);
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  if (!w || !h) throw new Error('format');
  const q = analyzeQuality(bmp, w, h);
  const full = drawScaled(bmp, w, h, 1600).c.toDataURL('image/jpeg', 0.85);
  const thumb = drawScaled(bmp, w, h, 360).c.toDataURL('image/jpeg', 0.6);
  if (bmp.close) bmp.close();
  return { full, thumb, q };
}
async function addImageFiles(files) {

const DOC_LIMIT = 14000;
async function readPdf(file) {
  if (!window.pdfjsLib) await loadScript(PDFJS_URL);
  try {
    const wsrc = await (await fetch(PDFJS_WORKER)).text();
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([wsrc], { type: 'text/javascript' }));
  } catch { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; }
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text = '';
  for (let p = 1; p <= pdf.numPages && text.length < DOC_LIMIT * 1.2; p++) {
    const c = await (await pdf.getPage(p)).getTextContent();
    text += c.items.map(i => i.str).join(' ') + '\n';
  }
  return text;
}
async function addDocFile(file) {
  if (!file) return;
  showToast('Skaitomas dokumentas...', 'info');
  try {
    let text = /\.pdf$/i.test(file.name) || file.type === 'application/pdf' ? await readPdf(file) : await file.text();
    text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    if (!text) throw new Error('Dokumente nerasta teksto (gal tai nuskaitytas vaizdas?)');
    const doc = { name: truncate(file.name, 60), text: text.slice(0, DOC_LIMIT) };
    const chat = getActiveChat();
    if (chat) { chat.doc = doc; saveChats(); } else state.pendingDoc = doc;
    renderTray(); updateSendState();
    showToast(text.length > DOC_LIMIT ? `Įkelta (naudojama pirmųjų ${DOC_LIMIT.toLocaleString('lt-LT')} simbolių)` : 'Dokumentas įkeltas', 'success');
  } catch (e) { showToast('Dokumento nepavyko perskaityti: ' + e.message, 'error'); }
}

}
function openProgress() {
  const qs = state.quizzes, total = qs.length;
  const pct = qs.length ? Math.round(qs.reduce((a, x) => a + x.correct / x.total, 0) / qs.length * 100) : 0;
  const scored = qs.filter(x => x.openScore != null), avgOpen = scored.length ? (scored.reduce((a, x) => a + x.openScore, 0) / scored.length).toFixed(1) : '—';
  const by = Object.values(MODELS).map(m => {
    const l = qs.filter(x => x.modelId === m.id);
    return { m, n: l.length, p: l.length ? Math.round(l.reduce((a, x) => a + x.correct / x.total, 0) / l.length * 100) : 0 };
  }).filter(x => x.n);

    title: 'Mokymosi progresas', subtitle: 'Tavo žinių patikrinimų statistika',
    bodyHTML: total ? `<div class="stat-grid"><div class="stat"><b>${total}</b><span>Patikrinimai</span></div><div class="stat"><b>${pct}%</b><span>Vid. tikslumas</span></div><div class="stat"><b>${avgOpen}</b><span>Atvirų vid. /10</span></div></div>
      <div class="sg-title">Pagal korepetitorių</div>${by.map(x => `<div class="bar-row"><span class="nm">${escapeHtml(x.m.name)}</span><div class="bar"><i style="width:${x.p}%;--c:${x.m.accent}"></i></div><span class="pc">${x.p}%</span></div>`).join('')}
      <div class="sg-title" style="margin-top:16px">Paskutiniai</div>${last.map(x => `<div class="hist"><span>${escapeHtml(truncate(x.topic, 34))}</span><span>${x.correct}/${x.total}${x.openScore != null ? ' · ' + x.openScore + '/10' : ''} · ${new Date(x.date).toLocaleDateString('lt-LT')}</span></div>`).join('')}`
      : '<p style="color:var(--text2);margin:0">Dar nėra patikrinimų. Po ilgesnio paaiškinimo paspausk „Taip, patikrink“ ir atlik trumpą testą — čia matysi savo progresą.</p>',

function buildMessageEl(msg, model, fresh = false) {

const scrollToBottom = (smooth = true) => { const a = $('#chatArea'); if (a) a.scrollTo({ top: a.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); };
const isNearBottom = () => { const a = $('#chatArea'); return !a || a.scrollHeight - a.scrollTop - a.clientHeight < 160; };
function showTypingAfter(anchorEl) {
  hideTyping();
  const model = getModel(state.activeModelId), box = $('#messages'); if (!box) return;
  const el = document.createElement('div'); el.className = 'msg ai typing'; el.id = 'typingIndicator';

  if (anchorEl) anchorEl.after(el); else box.appendChild(el);
  if (isNearBottom()) scrollToBottom();
}
const hideTyping = () => $('#typingIndicator')?.remove();

/* ============ 22. GENERAVIMAS (vieningas kelias: siuntimas, perkūrimas, lygių variantai) ============ */
async function runGeneration({ chat, model, history, anchorId = null, replaceId = null, levelOverride = null, variantLabel = null, extra = {} }) {
  state.isGenerating = true; state.controller = new AbortController(); updateSendState();
  const signal = state.controller.signal;
  const box = $('#messages');
  const aiMsg = { id: uid(), role: 'ai', content: '', timestamp: Date.now(), modelId: model.id };
  if (variantLabel) { aiMsg.variant = true; aiMsg.levelLabel = variantLabel; }
  const anchorEl = (replaceId || anchorId) ? box?.querySelector(`[data-msg-id="${replaceId || anchorId}"]`) : null;
  const oldEl = replaceId ? anchorEl : null;
  if (oldEl) oldEl.style.display = 'none';
  let msgEl = null, contentEl = null, timer = 0, last = 0;
  const place = el => { if (anchorEl) anchorEl.after(el); else box.appendChild(el); };
  showTypingAfter(anchorEl);
  if (model.voice) setRobot('thinking');

  const ensureMsgEl = () => {
    if (msgEl) return;
    hideTyping();
    msgEl = document.createElement('div'); msgEl.className = 'msg ai streaming'; msgEl.dataset.msgId = aiMsg.id;
    msgEl.innerHTML = `<div class="msg-avatar" style="background:${model.gradient}">${escapeHtml(model.avatar)}</div>
      <div class="msg-body"><div class="msg-head"><b>${escapeHtml(model.name)}</b><span class="msg-time">${formatTime(aiMsg.timestamp)}</span>${variantLabel ? `<span class="lvl-tag">${escapeHtml(variantLabel)}</span>` : ''}</div><div class="msg-content"></div></div>`;
    contentEl = $('.msg-content', msgEl); place(msgEl);
  };
  const render = () => {
    timer = 0; last = performance.now(); if (!contentEl) return;
    contentEl.innerHTML = renderMarkdown(parseAI(aiMsg.content).text, true) + '<span class="stream-cursor"></span>';
    if (isNearBottom()) scrollToBottom(false);
  };
  const schedule = () => { if (timer) return; timer = setTimeout(() => requestAnimationFrame(render), Math.max(0, 70 - (performance.now() - last))); };
  const reveal = async full => {
    ensureMsgEl();
    for (const chunk of full.match(/[\s\S]{1,5}/g) || []) {
      if (signal.aborted) throw userAbortError();
      aiMsg.content += chunk; schedule(); await sleep(14);
    }
  };
  const cleanup = () => { clearTimeout(timer); timer = 0; hideTyping(); };
  const restore = () => { cleanup(); msgEl?.remove(); if (oldEl) oldEl.style.display = ''; };
  const commit = () => {
    cleanup();
    const p = parseAI(aiMsg.content);
    aiMsg.content = p.text; if (p.mood) aiMsg.mood = p.mood; if (p.bad) aiMsg.badImage = p.bad;
    ensureMsgEl();
    if (replaceId) { const i = chat.messages.findIndex(m => m.id === replaceId); if (i >= 0) chat.messages.splice(i, 1, aiMsg); else chat.messages.push(aiMsg); oldEl?.remove(); }
    else if (anchorId) { const i = chat.messages.findIndex(m => m.id === anchorId); chat.messages.splice(i + 1, 0, aiMsg); }
    else chat.messages.push(aiMsg);
    chat.updatedAt = Date.now();
    if (!aiMsg.error && !variantLabel && !model.voice && state.settings.mode !== 'socratic' && aiMsg.content.length > 650 && !aiMsg.badImage) {
      chat.messages.forEach(m => { if (m !== aiMsg) delete m.offerQuiz; }); $$('.quiz-offer').forEach(e => e.remove());
      aiMsg.offerQuiz = true;
    }
    saveChats();
    msgEl.replaceWith(buildMessageEl(aiMsg, model, true));
    renderSidebar(); if (isNearBottom()) scrollToBottom();
  };

  let ok = false;
  try {
    const lastUser = [...history].reverse().find(m => m.role === 'user');
    const imgs = (lastUser?.images || []).map(i => imageStore.get(i.id)).filter(Boolean);
    if (lastUser?.images?.length && !imgs.length) showToast('Nuotrauka nebeprieinama po perkrovimo — atsiųsk ją iš naujo', 'info');
    const provider = providerFor();
    const api = buildApiMessages(model, chat, history, { imgs, level: levelOverride, ...extra });
    if (provider === 'openrouter') {
      await callOpenRouter(api, imgs.length ? state.settings.visionModel : state.settings.openrouterModel, {
        signal, maxTokens: model.maxTokens, onToken: tok => { ensureMsgEl(); aiMsg.content += tok; schedule(); } });
    } else if (provider === 'ollama') {
      await reveal(await callOllama(api, signal));
    } else {
      await sleep(model.voice ? 600 : 250);
      await reveal(imgs.length ? 'Demo režime nuotraukų neanalizuoju. Pasirink OpenRouter ar Ollama Nustatymuose ir atsiųsk nuotrauką dar kartą.' : demoReply(model, lastUser?.content));
    }
    if (!parseAI(aiMsg.content).text && !parseAI(aiMsg.content).bad) throw new Error('Tuščias atsakymas.');
    commit(); ok = true;
    if (model.voice && !variantLabel) {
      const mood = MOODS.includes(aiMsg.mood) ? aiMsg.mood : detectMood(aiMsg.content);
      setMood(mood, 0);
      if (/\b(labas|sveiki|sveikas)\b/.test(norm(aiMsg.content).slice(0, 40))) flashClass('wave', 2300);
      if (aiMsg.badImage) setMood('sad', 3500);
      if (state.settings.voiceOn) speakText(aiMsg.content, { msgId: aiMsg.id });
      else { setRobot('idle'); setCaption(''); setMood(mood, 3500); }
    }
  } catch (err) {
    if (err.userAbort) {
      if (aiMsg.content.trim()) { commit(); ok = true; } else restore();
      if (model.voice) { setRobot('idle'); setCaption(''); }
    } else {
      console.error('AI klaida:', err);
      restore();
      if (!replaceId) {
        const partial = parseAI(aiMsg.content).text;
        const e = { id: uid(), role: 'ai', error: true, timestamp: Date.now(), modelId: model.id,
          content: (partial ? partial + '\n\n' : '') + `**Klaida generuojant atsakymą.**\n\n\`${err.message}\`\n\nPatikrink Nustatymuose:\n- ar teisingas API raktas (OpenRouter),\n- ar modelis egzistuoja ir turi prieigą (nuotraukoms — Vision modelis),\n- ar paleistas Ollama (jei naudoji vietinį režimą).\n\nGali perjungti į **Demo režimą** Nustatymuose.` };
        chat.messages.push(e); chat.updatedAt = Date.now(); saveChats();
        $('#messages')?.appendChild(buildMessageEl(e, model, false)); scrollToBottom();
      }
      if (model.voice) { setRobot('idle'); setCaption('Atsiprašau, įvyko klaida.'); robotReact('sad'); }
      showToast('AI klaida: ' + err.message.slice(0, 110), 'error');
    }
  } finally {
    state.isGenerating = false; state.controller = null; updateSendState();
    if (!touchDevice() && !model.voice) $('#input').focus();
  }
  return ok ? aiMsg : null;
}

async function sendMessage(rawText, opts = {}) {
  if (state.isGenerating) return;
  let text = (rawText != null ? rawText : $('#input').value).trim();
  const images = state.pending.images.filter(i => !i.busy);
  if (state.pending.images.some(i => i.busy)) { showToast('Palauk, nuotrauka dar apdorojama', 'info'); return; }
  if (!text && !images.length) return;
  if (images.length && !(await confirmImagesOk(images))) return;
  if (!text) text = 'Išspręsk šią užduotį iš nuotraukos žingsnis po žingsnio.';
  stopSpeaking();

  let chat = getActiveChat();
  if (!chat) { chat = createChat(state.activeModelId, text); state.activeChatId = chat.id; }
  const model = getModel(chat.modelId || state.activeModelId);

  const userMsg = { id: uid(), role: 'user', content: text, timestamp: Date.now() };
  if (images.length) {
    userMsg.images = images.map(i => ({ id: i.id, thumb: i.thumb }));
    images.forEach(i => imageStore.set(i.id, i.full));
    while (imageStore.size > 12) imageStore.delete(imageStore.keys().next().value);
  }
  state.pending.images = []; renderTray();
  chat.messages.push(userMsg); chat.updatedAt = Date.now();
  if (chat.messages.filter(m => m.role === 'user').length === 1) chat.title = truncate(text, 48);

  const extra = {};
  if (state.settings.mode === 'socratic') {
    if (!chat.socStarted) { chat.socStarted = true; chat.socCount = 0; } else chat.socCount = (chat.socCount || 0) + 1;
    extra.socratic = true; extra.attempts = chat.socCount;
    if (opts.giveUp || chat.socCount >= 5) { extra.reveal = true; chat.socStarted = false; chat.socCount = 0; }
  }
  saveChats();
  $('#input').value = ''; autoResizeInput(); updateModeUi();

  if (!$('#messages')) renderChat(); else $('#messages').appendChild(buildMessageEl(userMsg, model));
  scrollToBottom(); renderSidebar();

  if (model.voice) {
    wakeRobot(); if (!$('#voiceCaption').textContent) setCaption('„' + truncate(text, 140) + '“');
    if (/\b(labas|sveiki|sveikas|ei)\b/.test(norm(text))) robotReact('wave');
  }
  await runGeneration({ chat, model, history: chat.messages, extra });
}
function stopGenerating() { if (state.controller) state.controller.abort(); }

async function regenerateMessage(id) {
  if (busyGuard()) return;
  const chat = getActiveChat(); if (!chat) return;
  const idx = chat.messages.findIndex(m => m.id === id);
  if (idx < 1 || chat.messages[idx].role !== 'ai') return;
  stopSpeaking();
  const model = getModel(chat.messages[idx].modelId || chat.modelId);
  await runGeneration({ chat, model, history: chat.messages.slice(0, idx), replaceId: id, extra: state.settings.mode === 'socratic' ? { socratic: true, attempts: chat.socCount || 0 } : {} });
}
async function regenerateAtLevel(id, level) {
  if (busyGuard()) return;
  const chat = getActiveChat(); if (!chat) return;
  const idx = chat.messages.findIndex(m => m.id === id);
  if (idx < 1) return;
  const model = getModel(chat.messages[idx].modelId || chat.modelId);
  await runGeneration({ chat, model, history: chat.messages.slice(0, idx), anchorId: id, levelOverride: level, variantLabel: 'Lygis: ' + LEVELS[level].label });
}

/* ============ 23. KOPIJAVIMAS, ATSISIUNTIMAS ============ */
async function copyToClipboard(text, ok = 'Nukopijuota') {
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    showToast(ok, 'success'); return true;
  } catch { showToast('Nepavyko nukopijuoti', 'error'); return false; }
}
function downloadCode(code, lang) {
  const ext = FILE_EXT[lang] || 'txt';
  const base = { html: 'puslapis', css: 'stilius', js: 'skriptas', py: 'programa', java: 'Main', sql: 'uzklausa' }[ext] || 'kodas';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain;charset=utf-8' }));
  a.download = `${base}.${ext}`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  showToast('Atsisiunčiamas ' + a.download, 'success');
}

/* ============ 24. ĮVESTIS ============ */
function autoResizeInput() { const i = $('#input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 200) + 'px'; }
function updateSendState() {
  const has = $('#input').value.trim().length > 0 || state.pending.images.some(i => !i.busy), s = $('#sendBtn'), g = state.isGenerating;
  s.disabled = !g && !has;
  s.classList.toggle('busy', g);
  s.setAttribute('aria-label', g ? 'Sustabdyti' : 'Siųsti'); s.title = g ? 'Sustabdyti' : 'Siųsti';
  $('#clearBtn').classList.toggle('visible', $('#input').value.length > 0 && !g);
  $('#micBtn').disabled = g;
}

/* ============ 25. ĮVYKIŲ DELEGAVIMAS (greitas — vienas klausytojas) ============ */
function onChatClick(e) {
  const inner = $('#chatInner');
  const chat = getActiveChat();
  const more = e.target.closest('[data-more]');
  if (more) { state.renderLimit += 60; const y = $('#chatArea').scrollHeight; renderChat(); $('#chatArea').scrollTop = $('#chatArea').scrollHeight - y; return; }
  const cat = e.target.closest('.category-card');
  if (cat) {
    const m = getModel(state.activeModelId), t = cat.dataset.category;
    const robo = { 'Pasisveikinimas': 'Labas!', 'Kaip sekasi?': 'Kaip sekasi?', 'Ką moki?': 'Ką tu moki?' };
    if (m.voice) { t === 'Balsu' ? toggleListening() : sendMessage(robo[t] || 'Labas!'); }
    else sendMessage(`Noriu sužinoti daugiau apie ${t}. Paaiškink pagrindus.`);
    return;
  }
  const chip = e.target.closest('.quick-chip'); if (chip) { sendMessage(chip.dataset.quick); return; }
  const cb = e.target.closest('[data-code-act]');
  if (cb) {
    const block = cb.closest('.code-block'), code = $('pre', block).textContent;
    if (cb.dataset.codeAct === 'copy') copyToClipboard(code, 'Kodas nukopijuotas').then(ok => { if (ok) { cb.classList.add('done'); $('span', cb).textContent = 'Nukopijuota'; setTimeout(() => { cb.classList.remove('done'); $('span', cb).textContent = 'Kopijuoti'; }, 1500); } });
    else downloadCode(code, block.dataset.lang);
    return;
  }
  if (e.target.closest('[data-retake]')) { (touchDevice() ? $('#camInput') : $('#imgInput')).click(); return; }
  const msgEl = e.target.closest('[data-msg-id]');
  const msg = msgEl && chat?.messages.find(m => m.id === msgEl.dataset.msgId);
  const opt = e.target.closest('[data-quiz-opt]');
  if (opt && msg?.quiz) {
    const i = +opt.dataset.qi, j = +opt.dataset.oi;
    if (msg.quiz.picked[i] != null) return;
    msg.quiz.picked[i] = j;
    const it = msg.quiz.mcq[i]; robotReact(j === it.answer ? 'happy' : 'sad');
    if (msg.quiz.picked.every(p => p != null) && !msg.quiz.open) { msg.quiz.finished = true; recordQuiz(chat, msg); }
    saveChats(); rerenderQuiz(msg); return;
  }
  if (msg?.quiz && e.target.closest('[data-quiz-grade]')) { gradeOpen(msg.id); return; }
  if (msg?.quiz && e.target.closest('[data-quiz-skip]')) { msg.quiz.finished = true; msg.quiz.openScore = null; recordQuiz(chat, msg); rerenderQuiz(msg); return; }
  const act = e.target.closest('[data-act]');
  if (!act || !msg) return;
  const a = act.dataset.act;
  if (a === 'copy') copyToClipboard(msg.content, 'Atsakymas nukopijuotas');
  else if (a === 'regen') regenerateMessage(msg.id);
  else if (a === 'read') { if (tts.msgId === msg.id) stopSpeaking(); else speakText(msg.content, { msgId: msg.id }); }
  else if (a === 'quizoffer') startQuiz(msg.id);
  else if (a === 'level') {
    const r = act.getBoundingClientRect();
    showMenu(r.right, r.bottom, Object.entries(LEVELS).map(([k, v]) => ({ label: v.label, icon: 'layers', onClick: () => regenerateAtLevel(msg.id, k) })));
  }
}
function onChatInput(e) {
  const ta = e.target.closest('[data-quiz-open]'); if (!ta) return;
  const id = ta.closest('[data-msg-id]')?.dataset.msgId, msg = getActiveChat()?.messages.find(m => m.id === id);
  if (msg?.quiz) msg.quiz.openText = ta.value;
}
function showChatContextMenu(x, y, chat) {
  showMenu(x, y, [
    { label: 'Pervadinti', icon: 'pencil', onClick: async () => { const t = await promptDialog({ title: 'Pervadinti pokalbį', subtitle: 'Įvesk naują pavadinimą', defaultValue: chat.title }); if (t) { renameChat(chat.id, t); renderSidebar(); showToast('Pokalbis pervadintas', 'success'); } } },
    { label: 'Ištrinti', icon: 'trash', danger: true, onClick: async () => { if (await confirmDialog({ title: 'Ištrinti pokalbį?', message: `„${chat.title}“ bus negrįžtamai pašalintas.`, confirmLabel: 'Ištrinti', danger: true })) { deleteChat(chat.id); renderSidebar(); renderChat(); showToast('Pokalbis ištrintas', 'success'); } } },
  ]);
}

/* ============ 26. INIT ============ */
function renderAll() {
  $('#app').classList.toggle('sidebar-collapsed', state.settings.sidebarCollapsed);
  applyModelAccent(getModel(state.activeModelId));
  updateTopbar(); updateStage(); updateProviderPill(); updateVoiceToggle(); updateModeUi(); renderSidebar(); renderChat(); renderTray(); updateSendState();
}
function seedDemoData() {
  if (localStorage.getItem(STORAGE.seeded)) return;
  try { localStorage.setItem(STORAGE.seeded, '1'); } catch {}
  if (state.chats.length) return;
  const now = Date.now();
  state.chats.push({ id: uid(), modelId: 'atlas', title: 'Pitagoro teorema', createdAt: now - 480000, updatedAt: now - 450000, messages: [
    { id: uid(), role: 'user', content: 'Paaiškink Pitagoro teoremą', timestamp: now - 480000 },
    { id: uid(), role: 'ai', modelId: 'atlas', timestamp: now - 450000, content: MODELS.atlas.demoResponses[0] }] });
  flushSave();
}
function init() {
  loadState(); seedDemoData();
  applyTheme(); applyReducedMotion();
  state.activeChatId = getChatsForModel(state.activeModelId)[0]?.id || null;
  if (synth) { pickBrowserVoice(); synth.addEventListener?.('voiceschanged', pickBrowserVoice); }
  $('#imgBtn').innerHTML = icon('image', 18); $('#camBtn').innerHTML = icon('camera', 18); $('#docBtn').innerHTML = icon('clip', 18);
  $('#progressIco').innerHTML = icon('chart', 17); $('#settingsIco').innerHTML = icon('gear', 17);
  renderAll(); initRobot();

  $('#sidebarCollapse').addEventListener('click', () => { state.settings.sidebarCollapsed = !state.settings.sidebarCollapsed; $('#app').classList.toggle('sidebar-collapsed', state.settings.sidebarCollapsed); saveSettings(); });
  $('#mobileMenuBtn').addEventListener('click', () => $('#app').classList.add('mobile-sidebar-open'));
  $('#overlay').addEventListener('click', () => $('#app').classList.remove('mobile-sidebar-open'));
  $('#newChatBtn').addEventListener('click', newChat);
  let st = 0;
  $('#chatSearch').addEventListener('input', e => { clearTimeout(st); const v = e.target.value.trim(); st = setTimeout(() => { state.searchQuery = v; renderSidebar(); }, 120); });
  $('#chatList').addEventListener('click', e => {
    const item = e.target.closest('.chat-item'); if (!item) return;
    if (e.target.closest('.chat-menu-btn')) { e.stopPropagation(); const r = e.target.closest('.chat-menu-btn').getBoundingClientRect(); const c = state.chats.find(x => x.id === item.dataset.id); if (c) showChatContextMenu(r.right, r.bottom, c); }
    else openChat(item.dataset.id);
  });
  $('#chatList').addEventListener('keydown', e => { const item = e.target.closest('.chat-item'); if (item && e.target === item && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openChat(item.dataset.id); } });
  $('#themeToggle').addEventListener('click', () => { state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; applyTheme(); saveSettings(); });
  $('#settingsBtn').addEventListener('click', () => { $('#app').classList.remove('mobile-sidebar-open'); openSettings(); });
  $('#progressBtn').addEventListener('click', () => { $('#app').classList.remove('mobile-sidebar-open'); openProgress(); });
  $('#micBtn').addEventListener('click', toggleListening);
  $('#voiceToggle').addEventListener('click', () => {
    state.settings.voiceOn = !state.settings.voiceOn;
    if (!state.settings.voiceOn) { stopSpeaking(); if (!state.isGenerating && !voice.listening) { setRobot('idle'); setCaption(''); } }
    updateVoiceToggle(); saveSettings();
  });
  $('#speakStop').addEventListener('click', () => stopSpeaking());

  // režimai, lygiai, Sokratas
  $('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.settings.mode = b.dataset.mode; saveSettings(); updateModeUi(); showToast(b.dataset.mode === 'socratic' ? 'Sokratiškas režimas: vesiu klausimais' : 'Atsakymo režimas', 'info'); });
  $('#levelSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.settings.level = b.dataset.level; saveSettings(); updateModeUi(); });
  $('#giveUpBtn').addEventListener('click', () => sendMessage('Pasiduodu — parodyk sprendimą.', { giveUp: true }));

  // priedai
  $('#imgBtn').addEventListener('click', () => $('#imgInput').click());
  $('#camBtn').addEventListener('click', () => $('#camInput').click());
  $('#docBtn').addEventListener('click', () => $('#docInput').click());
  $('#imgInput').addEventListener('change', e => { addImageFiles([...e.target.files]); e.target.value = ''; });
  $('#camInput').addEventListener('change', e => { addImageFiles([...e.target.files]); e.target.value = ''; });
  $('#docInput').addEventListener('change', e => { addDocFile(e.target.files[0]); e.target.value = ''; });
  $('#tray').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'); if (rm) { state.pending.images.splice(+rm.dataset.rm, 1); renderTray(); updateSendState(); return; }
    if (e.target.closest('[data-rmdoc]')) removeDoc();
  });
  const input = $('#input');
  input.addEventListener('paste', e => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) { e.preventDefault(); const imgs = files.filter(f => f.type.startsWith('image/')); if (imgs.length) addImageFiles(imgs); else addDocFile(files[0]); }
  });
  let dragN = 0; const hint = $('#dropHint');
  window.addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { dragN++; hint.classList.add('on'); } });
  window.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) hint.classList.remove('on'); });
  window.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!e.dataTransfer?.files?.length) return;
    e.preventDefault(); dragN = 0; hint.classList.remove('on');
    const files = [...e.dataTransfer.files], imgs = files.filter(f => f.type.startsWith('image/'));
    if (imgs.length) addImageFiles(imgs); else addDocFile(files[0]);
  });

  const ci = $('#chatInner'); ci.addEventListener('click', onChatClick); ci.addEventListener('input', onChatInput);
  input.addEventListener('input', () => { autoResizeInput(); updateSendState(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!state.isGenerating) sendMessage(); } });
  $('#sendBtn').addEventListener('click', () => state.isGenerating ? stopGenerating() : sendMessage());
  $('#clearBtn').addEventListener('click', () => { input.value = ''; autoResizeInput(); updateSendState(); input.focus(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      $('#app').classList.remove('mobile-sidebar-open'); closeContextMenu();
      if (state.isGenerating && !$('#modalRoot').children.length) stopGenerating();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); (state.settings.sidebarCollapsed ? input : $('#chatSearch')).focus(); }
  });
  document.addEventListener('visibilitychange', () => {
    document.documentElement.classList.toggle('paused', document.hidden);
    if (document.hidden) flushSave();
  });
  window.addEventListener('beforeunload', () => { stopSpeaking(true); flushSave(); });
  setTimeout(() => { if (!touchDevice() && !getModel(state.activeModelId).voice) input.focus(); }, 100);
}
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();

</script>
