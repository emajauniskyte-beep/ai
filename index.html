<!DOCTYPE html>
<html lang="lt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Studio AI — mokymosi platforma su šešiais specializuotais AI asistentais.">
<title>Studio AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--pill:999px;--sb:288px;--sbc:76px;
--ease:cubic-bezier(.4,0,.2,1);--out:cubic-bezier(.16,1,.3,1);--fast:.12s;--dur:.18s;--slow:.28s;--max:860px;
--accent:#fff;--accent-rgb:255,255,255}
:root[data-theme=dark]{--bg:#040404;--elev:#0a0a0a;--panel:#0d0d0d;--surface:#161616;--line:#1e1e1e;--line2:#2a2a2a;--text:#fafafa;--text2:#a3a3a3;--muted:#737373;--muted2:#525252;--hover:#161616;--active:#1e1e1e;--overlay:rgba(0,0,0,.82);--shadow:0 24px 70px rgba(0,0,0,.7);--glass:rgba(10,10,10,.78);--ai:#0f0f0f;--ai-b:#1e1e1e;--u-bg:#fafafa;--u-tx:#050505;--code:#000;--send:#fafafa;--send-t:#050505}
:root[data-theme=light]{--bg:#fafafa;--elev:#fff;--panel:#fff;--surface:#f0f0f0;--line:#e5e5e5;--line2:#d4d4d4;--text:#0a0a0a;--text2:#525252;--muted:#737373;--muted2:#a3a3a3;--hover:#f0f0f0;--active:#e5e5e5;--overlay:rgba(0,0,0,.35);--shadow:0 20px 60px rgba(0,0,0,.15);--glass:rgba(255,255,255,.78);--ai:#fff;--ai-b:#e5e5e5;--u-bg:#0a0a0a;--u-tx:#fafafa;--code:#0a0a0a;--send:#0a0a0a;--send-t:#fafafa}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:14.5px;line-height:1.55;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:var(--pill)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

.app{display:grid;grid-template-columns:var(--sb) 1fr;height:100vh;height:100dvh;transition:grid-template-columns var(--dur) var(--ease);overflow:hidden;background:radial-gradient(1200px 600px at 0 0,rgba(var(--accent-rgb),.03),transparent 60%),var(--bg)}
.app.sidebar-collapsed{grid-template-columns:var(--sbc) 1fr}
.sidebar{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0;min-height:0;overflow:hidden;z-index:30}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-bottom:1px solid var(--line);min-height:64px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;flex:1}
.brand-logo{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:var(--text);color:var(--bg)}
.brand-text{display:flex;flex-direction:column;white-space:nowrap}
.brand-text b{font-size:14.5px;font-weight:700}
.brand-text span{font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.sidebar-collapse{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.sidebar-collapse:hover{background:var(--hover);color:var(--text)}
.app.sidebar-collapsed .sidebar-collapse svg{transform:rotate(180deg)}
.app.sidebar-collapsed .brand-text{display:none}
.app.sidebar-collapsed .sidebar-header{flex-direction:column;justify-content:center;padding:14px 8px}
.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 0;display:flex;flex-direction:column;gap:4px;min-height:0}
.sec-label{padding:12px 10px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);white-space:nowrap}
.app.sidebar-collapsed .sec-label{opacity:0;height:16px;padding:4px 0;overflow:hidden}
.model-list{display:flex;flex-direction:column;gap:4px}
.model-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-md);border:1px solid transparent;text-align:left;width:100%;min-height:48px;position:relative;transition:background var(--fast),transform var(--dur) var(--out)}
.model-item:hover{background:var(--hover);transform:translateX(2px)}
.model-item.active{background:rgba(var(--m),.1);border-color:rgba(var(--m),.25)}
.model-avatar{width:32px;height:32px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.model-avatar.lg{width:36px;height:36px;font-size:14px}
.model-info{display:flex;flex-direction:column;min-width:0;flex:1}
.model-info b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-info span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.sidebar-collapsed .model-info{display:none}
.app.sidebar-collapsed .model-item{justify-content:center;padding:10px 0}
.chat-actions{display:flex;gap:6px;padding:2px 4px 8px}
.search-box{position:relative;flex:1}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box input{width:100%;height:34px;padding:0 10px 0 32px;background:var(--elev);border:1px solid var(--line);border-radius:var(--r-sm);font-size:12.5px}
.search-box input:focus{outline:0;border-color:var(--text2)}
.btn-new-chat{height:34px;width:34px;flex-shrink:0;border-radius:var(--r-sm);background:var(--elev);border:1px solid var(--line);color:var(--text2);display:grid;place-items:center}
.btn-new-chat:hover{background:var(--text);color:var(--bg)}
.chat-list{display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.chat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);color:var(--text2);cursor:pointer;font-size:13px;min-height:36px}
.chat-item:hover{background:var(--hover);color:var(--text)}
.chat-item.active{background:var(--active);color:var(--text)}
.chat-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chat-menu-btn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.chat-item:hover .chat-menu-btn,.chat-item.active .chat-menu-btn,.chat-menu-btn:focus-visible{opacity:1}
.chat-menu-btn:hover{background:var(--line2);color:var(--text)}
.app.sidebar-collapsed .chat-list,.app.sidebar-collapsed .chat-actions{display:none}
.chat-empty{padding:20px 12px;font-size:12.5px;color:var(--muted2);text-align:center}
.sidebar-footer{padding:10px;border-top:1px solid var(--line)}
.sf-btn{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-md);color:var(--text2);font-size:13px;font-weight:500;width:100%}
.sf-btn:hover{background:var(--hover);color:var(--text)}
.app.sidebar-collapsed .sf-btn{justify-content:center}.app.sidebar-collapsed .sf-btn span{display:none}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex-shrink:0;min-height:64px;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.mobile-menu-btn{display:none;width:36px;height:36px;border-radius:var(--r-sm);color:var(--text2);align-items:center;justify-content:center}
.topbar-model{display:flex;align-items:center;gap:11px;min-width:0}
.topbar-model-info b{font-size:14.5px;font-weight:600;white-space:nowrap}
.tm-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.status-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5)}
.topbar-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--pill);font-size:11.5px;font-weight:500;color:var(--text2);background:var(--elev);border:1px solid var(--line);white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text2)}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* ROBO BALSO SCENA */
.voice-stage{display:none;flex-shrink:0;flex-direction:column;align-items:center;gap:8px;padding:16px 16px 14px;border-bottom:1px solid var(--line);background:radial-gradient(520px 200px at 50% 0,rgba(var(--accent-rgb),.14),transparent 72%)}
.voice-stage.on{display:flex}
.robot-wrap{position:relative;width:176px;height:176px}
.robot-wrap::before{content:'';position:absolute;inset:6px;border-radius:50%;background:rgba(var(--accent-rgb),.12);filter:blur(22px);opacity:.5;transition:opacity .3s}
.voice-stage[data-state=listening] .robot-wrap::before,.voice-stage[data-state=speaking] .robot-wrap::before{opacity:1;animation:halo 1.4s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.12)}}
.robot{position:relative;width:100%;height:100%;color:var(--text);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.robot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite;transition:fill .2s}
.robot .mouth{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.robot .ant{fill:rgb(var(--accent-rgb))}
.robot .dots{opacity:0;transition:opacity .2s}
.robot .dots circle{fill:rgb(var(--accent-rgb));animation:dotp 1s infinite}
.robot .dots circle:nth-child(2){animation-delay:.15s}.robot .dots circle:nth-child(3){animation-delay:.3s}
@keyframes dotp{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
.robot .dots circle{transform-box:fill-box}
.voice-stage[data-state=listening] .ant{animation:pulse .8s infinite}
.voice-stage[data-state=listening] .eye{fill:rgb(var(--accent-rgb))}
.voice-stage[data-state=listening] .mouth{transform:scaleY(1.7) scaleX(.55)}
.voice-stage[data-state=speaking] .mouth{animation:talk .26s infinite alternate}
.voice-stage[data-state=speaking] .eye{fill:rgb(var(--accent-rgb))}
.voice-stage[data-state=thinking] .eye{animation:look 1s infinite alternate ease-in-out}
.voice-stage[data-state=thinking] .dots{opacity:1}
.voice-stage[data-state=thinking] .robot{animation:tilt 2s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.9)}}
@keyframes look{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.voice-status{font-size:13px;font-weight:600;color:var(--text);min-height:19px;text-align:center}
.voice-caption{font-size:12.5px;color:var(--text2);text-align:center;max-width:min(620px,92%);min-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-style:italic}
.wave{display:none;align-items:center;gap:3px;height:16px}
.voice-stage[data-state=listening] .wave{display:flex}
.wave i{width:3px;height:4px;border-radius:2px;background:rgb(var(--accent-rgb));animation:bar .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes bar{50%{height:16px}}
.voice-controls{display:flex;align-items:center;gap:10px}
.mic-btn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--send);color:var(--send-t);transition:transform var(--fast),box-shadow var(--fast)}
.mic-btn:hover:not(:disabled){transform:scale(1.07)}
.mic-btn:disabled{opacity:.4;cursor:not-allowed}
.mic-btn.rec{background:#ef4444;color:#fff;animation:recring 1.2s infinite}
@keyframes recring{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}100%{box-shadow:0 0 0 16px rgba(239,68,68,0)}}
.voice-toggle{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--pill);border:1px solid var(--line);background:var(--elev);color:var(--text2);font-size:12px;font-weight:500}
.voice-toggle.off{opacity:.55}

.chat-area{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.chat-inner{max-width:var(--max);margin:0 auto;padding:28px 24px 12px;min-height:100%}
.welcome{padding:10px 0 40px;animation:fadeUp var(--slow) var(--out)}
.welcome-hero{text-align:center;padding:20px 0 32px}
.welcome-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:var(--pill);background:var(--elev);border:1px solid var(--line);color:var(--text2);font-size:11.5px;font-weight:600;margin-bottom:18px}
.welcome-hero h1{font-size:clamp(24px,3.5vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:0 0 12px}
.welcome-hero p{font-size:15px;color:var(--text2);margin:0 auto;max-width:540px}
.w-title{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 14px}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:28px}
.category-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);text-align:left;transition:transform var(--dur) var(--out),border-color var(--dur)}
.category-card:hover{transform:translateY(-4px);border-color:var(--line2)}
.category-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.category-card b{font-size:13.5px;font-weight:600}
.category-card span{font-size:12px;color:var(--muted)}
.quick-list{display:flex;flex-wrap:wrap;gap:8px}
.quick-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line);color:var(--text2);font-size:12.8px;font-weight:500;text-align:left}
.quick-chip:hover{background:var(--text);border-color:var(--text);color:var(--bg)}

.messages{display:flex;flex-direction:column;gap:22px;padding-bottom:16px}
.msg{display:flex;gap:12px;animation:fadeUp var(--slow) var(--out)}
.msg.user{justify-content:flex-end}
.msg-avatar{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:2px}
.msg.fresh .msg-avatar,.msg.streaming .msg-avatar{animation:pop .5s var(--out)}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg)}60%{transform:scale(1.15)}100%{transform:none}}
.msg-body{min-width:0;max-width:min(100%,680px);display:flex;flex-direction:column;gap:6px}
.msg.user .msg-body{align-items:flex-end}
.msg-head{display:flex;align-items:center;gap:8px;padding:0 2px;font-size:12px;color:var(--muted)}
.msg-head b{color:var(--text2);font-weight:600;font-size:12.5px}
.msg-time{font-size:11px;color:var(--muted2)}
.msg-content{font-size:14.5px;line-height:1.68;overflow-wrap:anywhere}
.msg.user .msg-content{background:var(--u-bg);color:var(--u-tx);padding:11px 16px;border-radius:16px 16px 4px 16px;max-width:100%;white-space:pre-wrap}
.msg.ai .msg-content{background:var(--ai);border:1px solid var(--ai-b);border-radius:4px 16px 16px 16px;padding:12px 16px;transition:border-color .3s,box-shadow .3s}
.msg.ai.streaming .msg-content{border-color:rgba(var(--accent-rgb),.55);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08),0 0 24px rgba(var(--accent-rgb),.12);animation:streamglow 1.6s ease-in-out infinite}
@keyframes streamglow{50%{box-shadow:0 0 0 5px rgba(var(--accent-rgb),.14),0 0 34px rgba(var(--accent-rgb),.22)}}
.msg.ai.fresh .msg-content{animation:done .9s var(--out)}
@keyframes done{0%{border-color:rgba(var(--accent-rgb),.9);box-shadow:0 0 0 0 rgba(var(--accent-rgb),.5)}100%{border-color:var(--ai-b);box-shadow:0 0 0 14px rgba(var(--accent-rgb),0)}}
.msg-actions{display:flex;gap:2px;opacity:0;transition:opacity var(--fast)}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1}
@media (hover:none){.msg-actions{opacity:1}}
.msg-action{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-size:11px;color:var(--muted)}
.msg-action:hover{background:var(--hover);color:var(--text)}
.stream-cursor{display:inline-block;width:7px;height:1em;background:rgb(var(--accent-rgb));margin-left:2px;vertical-align:text-bottom;border-radius:2px;animation:cur 1s steps(2) infinite}
@keyframes cur{50%{opacity:0}}
.typing .msg-content{display:inline-flex;gap:5px;align-items:center;padding:14px 18px}
.typing i{width:6px;height:6px;border-radius:50%;background:rgb(var(--accent-rgb));animation:bounce 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.msg.ai .msg-content p{margin:0 0 10px}.msg.ai .msg-content p:last-child{margin-bottom:0}
.msg.ai .msg-content :is(h2,h3,h4,h5){margin:16px 0 8px;font-weight:700;line-height:1.3}
.msg.ai .msg-content :is(h2,h3,h4,h5):first-child{margin-top:0}
.msg.ai .msg-content :is(ul,ol){margin:6px 0 10px;padding-left:22px}
.msg.ai .msg-content li{margin:3px 0}
.msg.ai .msg-content blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--text2);background:var(--surface);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--text2)}
.msg.ai .msg-content blockquote p{margin:0}
.msg.ai .msg-content hr{border:0;height:1px;background:var(--line);margin:14px 0}
.msg.ai .msg-content a{text-decoration:underline;text-underline-offset:2px}
.inline-code{font-family:var(--font-mono);font-size:.87em;padding:2px 6px;background:var(--surface);border:1px solid var(--line);border-radius:5px}
.math-inline{font-family:var(--font-mono);font-size:.93em;padding:1px 6px;background:var(--surface);border-radius:5px;white-space:nowrap}
.math-block{display:block;padding:14px 18px;margin:12px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font-family:var(--font-mono);line-height:1.85;white-space:pre-wrap;overflow-x:auto}
.code-block{margin:12px 0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--code)}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06)}
.code-lang{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8f93b5;font-family:var(--font-mono)}
.code-copy{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;font-size:10.5px;color:#8f93b5}
.code-copy:hover{background:rgba(255,255,255,.08);color:#e8e9f3}
.code-block pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--font-mono);font-size:12.8px;line-height:1.6;color:#fafafa}

.composer{padding:12px 22px 16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.composer-inner{max-width:var(--max);margin:0 auto}
.input-shell{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px;background:var(--elev);border:1.5px solid var(--line);border-radius:18px}
.input-shell:focus-within{border-color:var(--text2);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.08)}
.input-shell textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;line-height:1.5;padding:8px 0;max-height:200px}
.input-shell textarea::placeholder{color:var(--muted2)}
.clear-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);align-self:center;opacity:0;pointer-events:none}
.clear-btn.visible{opacity:1;pointer-events:auto}
.clear-btn:hover{background:var(--hover);color:var(--text)}
/* Siuntimo mygtukas: švari animacija be iškirptų ratų */
.send-btn{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:var(--send);color:var(--send-t);transition:transform var(--fast),opacity var(--fast),border-radius .25s var(--ease),background .2s}
.send-btn:hover:not(:disabled){transform:scale(1.07)}
.send-btn:active:not(:disabled){transform:scale(.94)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.send-btn .ico-stop{display:none}
.send-btn.busy{border-radius:50%;background:var(--send);animation:sendring 1.3s ease-out infinite}
.send-btn.busy .ico-send{display:none}
.send-btn.busy .ico-stop{display:block;animation:stoppulse 1.3s ease-in-out infinite}
@keyframes sendring{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.55)}100%{box-shadow:0 0 0 12px rgba(var(--accent-rgb),0)}}
@keyframes stoppulse{50%{transform:scale(.8)}}
.input-hint{display:flex;justify-content:space-between;gap:12px;padding:8px 6px 0;font-size:11px;color:var(--muted2)}
.input-hint kbd{padding:1px 5px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:10px;font-weight:600;color:var(--muted)}
.demo-note{display:inline-flex;align-items:center;gap:5px}

.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--pill);background:var(--panel);border:1px solid var(--line2);font-size:13px;font-weight:500;box-shadow:var(--shadow);opacity:0;transform:translateY(14px);transition:opacity var(--dur),transform var(--dur)}
.toast.show{opacity:1;transform:none}
.toast.success svg{color:#22c55e}.toast.error svg{color:#ef4444}
.modal-backdrop{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);z-index:150;display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{width:100%;max-width:500px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;margin:auto;max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:fadeUp var(--slow) var(--out)}
.modal-head{padding:20px 22px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-head h2{font-size:16px;font-weight:700;margin:0}
.modal-head p{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.modal-close{width:30px;height:30px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.modal-close:hover{background:var(--hover);color:var(--text)}
.modal-body{padding:16px 22px;overflow-y:auto;flex:1}
.modal-foot{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--text2);border:1px solid var(--line)}
.btn-secondary:hover:not(:disabled){background:var(--hover);color:var(--text)}
.btn-primary{background:var(--text);color:var(--bg);border:1px solid var(--text)}
.btn-danger{background:#ef4444;color:#fff;border:1px solid #ef4444}
.btn-block{width:100%}
.modal-input,.settings-field input{width:100%;height:40px;padding:0 12px;background:var(--elev);border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:14px}
.modal-input:focus,.settings-field input:focus{outline:0;border-color:var(--text2)}
.settings-group{margin-bottom:18px}.settings-group:last-child{margin-bottom:0}
.sg-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.settings-label{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.settings-label b{font-size:13.5px;font-weight:500}.settings-label span{font-size:11.5px;color:var(--muted)}
.settings-field{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.settings-field label{font-size:12px;font-weight:500;color:var(--text2)}
.settings-field input{height:38px;font-size:13px}
.settings-field small{font-size:11px;color:var(--muted)}
.settings-field small a{text-decoration:underline}
.settings-field code{font-family:var(--font-mono);font-size:10.5px;background:var(--surface);padding:1px 4px;border-radius:3px}
.toggle-group{display:inline-flex;background:var(--elev);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.toggle-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.toggle-btn.active{background:var(--panel);color:var(--text)}
.switch{position:relative;width:38px;height:22px;border-radius:var(--pill);background:var(--line2);flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--fast)}
.switch.on{background:var(--text)}.switch.on::after{transform:translateX(16px)}
.provider-tabs{display:flex;gap:4px;padding:3px;background:var(--elev);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px}
.provider-tab{flex:1;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.provider-tab.active{background:var(--panel);color:var(--text)}
.provider-tab small{display:block;font-size:10px;font-weight:400;color:var(--muted2)}
.context-menu{position:fixed;z-index:180;min-width:160px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:var(--shadow);padding:5px}
.context-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text2);text-align:left}
.context-menu button:hover{background:var(--hover);color:var(--text)}
.context-menu button.danger{color:#ef4444}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:25;opacity:0;pointer-events:none;transition:opacity var(--dur)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:900px){
.app,.app.sidebar-collapsed{grid-template-columns:1fr}
.sidebar{position:fixed;inset:0 auto 0 0;width:288px;max-width:85vw;transform:translateX(-100%);transition:transform var(--dur) var(--out);box-shadow:var(--shadow)}
.app.mobile-sidebar-open .sidebar{transform:none}
.app.mobile-sidebar-open .overlay{opacity:1;pointer-events:auto}
.mobile-menu-btn{display:flex}.sidebar-collapse{display:none}
.app.sidebar-collapsed .brand-text,.app.sidebar-collapsed .model-info,.app.sidebar-collapsed .chat-list,.app.sidebar-collapsed .chat-actions{display:flex}
.app.sidebar-collapsed .brand-text,.app.sidebar-collapsed .chat-list{flex-direction:column}
.app.sidebar-collapsed .sec-label{opacity:1;height:auto;padding:12px 10px 6px}
.app.sidebar-collapsed .model-item,.app.sidebar-collapsed .sf-btn{justify-content:flex-start;padding:9px 10px}
.app.sidebar-collapsed .sf-btn span{display:inline}
.app.sidebar-collapsed .sidebar-header{flex-direction:row}}
@media (max-width:640px){
.topbar{padding:10px 14px}.pill{display:none}.chat-inner{padding:20px 14px 8px}.composer{padding:10px 12px 12px}
.welcome-hero h1{font-size:22px}.category-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kbd-group{display:none}.robot-wrap{width:132px;height:132px}.voice-stage{padding:10px 12px}.toasts{bottom:80px}}
@media (max-height:640px){.robot-wrap{width:110px;height:110px}}
html,body,.app,.main,.chat-area{max-width:100vw}

/* ============ 4. LATEX → UNICODE ============ */
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ'};
const SUB = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','o':'ₒ','x':'ₓ','n':'ₙ','i':'ᵢ','j':'ⱼ'};
const BB = {R:'ℝ',N:'ℕ',Z:'ℤ',Q:'ℚ',C:'ℂ',P:'ℙ',H:'ℍ'};
const mapStr = (s, m) => [...s].map(c => m[c] || c).join('');
const SYMBOLS = {
  alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',varepsilon:'ε',zeta:'ζ',eta:'η',theta:'θ',vartheta:'θ',iota:'ι',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',xi:'ξ',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',upsilon:'υ',phi:'φ',varphi:'φ',chi:'χ',psi:'ψ',omega:'ω',
  Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Xi:'Ξ',Pi:'Π',Sigma:'Σ',Phi:'Φ',Psi:'Ψ',Omega:'Ω',
  times:'×',div:'÷',cdot:'·',pm:'±',mp:'∓',leq:'≤',le:'≤',geq:'≥',ge:'≥',neq:'≠',ne:'≠',approx:'≈',equiv:'≡',sim:'∼',propto:'∝',ll:'≪',gg:'≫',infty:'∞',
  rightarrow:'→',to:'→',leftarrow:'←',Rightarrow:'⇒',Leftarrow:'⇐',leftrightarrow:'↔',Leftrightarrow:'⇔',mapsto:'↦',
  sum:'Σ',prod:'∏',int:'∫',iint:'∬',oint:'∮',partial:'∂',nabla:'∇',in:'∈',notin:'∉',subset:'⊂',supset:'⊃',subseteq:'⊆',supseteq:'⊇',cup:'∪',cap:'∩',
  forall:'∀',exists:'∃',neg:'¬',emptyset:'∅',varnothing:'∅',angle:'∠',triangle:'△',circ:'∘',bullet:'•',ldots:'…',cdots:'⋯',dots:'…',prime:'′',degree:'°',
  langle:'⟨',rangle:'⟩',lfloor:'⌊',rfloor:'⌋',lceil:'⌈',rceil:'⌉',perp:'⊥',parallel:'∥',because:'∵',therefore:'∴',hbar:'ℏ',ell:'ℓ',
};
const MATH_FNS = 'sin cos tan cot sec csc arcsin arccos arctan sinh cosh tanh log ln lg exp lim max min sup inf det dim gcd arg mod'.split(' ');

function latexToUnicode(latex) {
  let s = String(latex || '');
  s = s.replace(/\\(?:begin|end)\{[a-zA-Z*]+\}(\{[^}]*\})?/g, '');
  s = s.replace(/\\\\/g, '\n').replace(/&=/g, '=').replace(/&/g, '');
  for (let i = 0; i < 3; i++) s = s.replace(/\\[dt]?frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1)/($2)');
  s = s.replace(/\\sqrt\[([^\]]+)\]\{([^{}]+)\}/g, (m, n, x) => mapStr(n, SUP) + '√(' + x + ')')
       .replace(/\\sqrt\{([^{}]+)\}/g, '√($1)').replace(/\\sqrt\s*([a-zA-Z0-9])/g, '√$1');
  s = s.replace(/\^\{([^{}]+)\}/g, (m, e) => mapStr(e, SUP)).replace(/\^(\w)/g, (m, c) => mapStr(c, SUP))
       .replace(/_\{([^{}]+)\}/g, (m, e) => mapStr(e, SUB)).replace(/_(\w)/g, (m, c) => mapStr(c, SUB));
  s = s.replace(/\\([a-zA-Z]+)/g, (m, name) => SYMBOLS[name] || (MATH_FNS.includes(name) ? name : m));
  s = s.replace(/\\left\s*([([{.|])/g, (m, c) => c === '.' ? '' : c).replace(/\\right\s*([)\]}.|])/g, (m, c) => c === '.' ? '' : c);
  s = s.replace(/\\([{}|])/g, '$1');
  s = s.replace(/\\(?:text(?:rm|bf|it|sf|tt|normal)?|mathrm|mathbf|mathit|mathsf|mathcal|mathfrak|operatorname)\{([^{}]+)\}/g, '$1')
       .replace(/\\mathbb\{([^{}]+)\}/g, (m, c) => mapStr(c, BB))
       .replace(/\\(?:overline|bar)\{([^{}]+)\}/g, '$1\u0304').replace(/\\vec\{([^{}]+)\}/g, '$1\u20D7')
       .replace(/\\hat\{([^{}]+)\}/g, '$1\u0302').replace(/\\tilde\{([^{}]+)\}/g, '$1\u0303').replace(/\\dot\{([^{}]+)\}/g, '$1\u0307');
  s = s.replace(/\\qquad/g, '    ').replace(/\\quad/g, '  ').replace(/\\[,;:! ]/g, ' ');
  s = s.replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '');
  return s.replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n').trim();
}

function renderMarkdown(text, streaming = false) {
  if (!text) return '';
  let src = String(text);
  if (streaming && (src.match(/```/g) || []).length % 2 === 1) src += '\n```';
  const maths = [], codes = [];
  const holdMath = (e, block) => { maths.push({ e, block }); return `\u0001M${maths.length - 1}\u0001`; };
  let w = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => { codes.push({ lang: (lang || 'code').toLowerCase(), code: code.replace(/\n$/, '') }); return `\u0001C${codes.length - 1}\u0001`; });
  w = w.replace(/\$\$([\s\S]+?)\$\$/g, (m, e) => holdMath(e, true))
       .replace(/\\\[([\s\S]+?)\\\]/g, (m, e) => holdMath(e, true))
       .replace(/\\begin\{([a-zA-Z*]+)\}([\s\S]*?)\\end\{\1\}/g, (m, env, body) => holdMath(body, true))
       .replace(/(?<![\w$\\])\$(?![\s$])([^$\n]+?)(?<![\s\\])\$(?![\w$])/g, (m, e) => holdMath(e, false))
       .replace(/\\\(([\s\S]+?)\\\)/g, (m, e) => holdMath(e, false));

  w = escapeHtml(w)
    .replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g, '$1<em>$2</em>');

  const out = []; let listType = null, inQuote = false, para = [];
  const flushPara = () => { if (para.length) { const c = para.join(' ').trim(); if (c) out.push(`<p>${c}</p>`); para = []; } };
  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
  const closeQuote = () => { if (inQuote) { out.push('</blockquote>'); inQuote = false; } };
  const closeAll = () => { flushPara(); closeList(); closeQuote(); };

  for (const line of w.split('\n')) {
    const t = line.trim();
    if (/^\u0001[CM]\d+\u0001$/.test(t)) { closeAll(); out.push(t); continue; }
    if (!t) { closeAll(); continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.+)$/))) { closeAll(); const l = m[1].length + 1; out.push(`<h${l}>${m[2]}</h${l}>`); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { closeAll(); out.push('<hr>'); continue; }
    if (/^&gt;\s?/.test(t)) { flushPara(); closeList(); if (!inQuote) { out.push('<blockquote>'); inQuote = true; } out.push(`<p>${t.replace(/^&gt;\s?/, '')}</p>`); continue; }
    closeQuote();
    if ((m = t.match(/^[-*+]\s+(.+)$/))) { flushPara(); if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; } out.push(`<li>${m[1]}</li>`); continue; }
    if ((m = t.match(/^\d+[.)]\s+(.+)$/))) { flushPara(); if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; } out.push(`<li>${m[1]}</li>`); continue; }
    closeList(); para.push(t);
  }
  closeAll();

  return out.join('\n')
    .replace(/\u0001M(\d+)\u0001/g, (m, i) => {
      const mb = maths[+i], tag = mb.block ? 'div' : 'span';
      return `<${tag} class="${mb.block ? 'math-block' : 'math-inline'}">${escapeHtml(latexToUnicode(mb.e))}</${tag}>`;
    })
    .replace(/\u0001C(\d+)\u0001/g, (m, i) => {
      const cb = codes[+i];
      return `<div class="code-block"><div class="code-header"><span class="code-lang">${escapeHtml(cb.lang)}</span>
        <button class="code-copy" data-code="${encodeURIComponent(cb.code)}" aria-label="Kopijuoti kodą">${icon('copy', 11)}<span>Kopijuoti</span></button></div>
        <pre><code>${escapeHtml(cb.code)}</code></pre></div>`;
    });
}

/* ============ 8. API KLIENTAS ============ */
function userAbortError() { const e = new Error('Nutraukta'); e.userAbort = true; return e; }
async function readError(res, name) {
  let detail = '';
  try { const j = await res.json(); detail = j?.error?.message || JSON.stringify(j); } catch { try { detail = await res.text(); } catch {} }
  const hint = res.status === 401 || res.status === 403 ? ' (patikrink API raktą Nustatymuose)' : res.status === 429 ? ' (per daug užklausų, palauk)' : '';
  return new Error(`${name} ${res.status}: ${String(detail).slice(0, 220)}${hint}`);
}
/* opts: { onToken, signal, maxTokens } — be onToken grąžina visą atsakymą iš karto. */
async function callOpenRouter(messages, modelName, opts = {}) {
  const key = getApiKey();
  if (!key) throw new Error('Trūksta OpenRouter API rakto. Įvesk jį Nustatymuose arba pasirink Demo režimą.');
  const ctrl = new AbortController();
  let userAborted = false;
  if (opts.signal) {
    if (opts.signal.aborted) userAborted = true, ctrl.abort();
    opts.signal.addEventListener('abort', () => { userAborted = true; ctrl.abort(); }, { once: true });
  }
  let timer = setTimeout(() => ctrl.abort(), 60000);
  const bump = () => { clearTimeout(timer); timer = setTimeout(() => ctrl.abort(), 30000); };
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json', 'HTTP-Referer': location.origin && location.origin !== 'null' ? location.origin : 'https://localhost', 'X-Title': 'Studio AI' },
      body: JSON.stringify({ model: modelName, messages, max_tokens: opts.maxTokens || 1200, temperature: 0.5, stream: !!opts.onToken }),
      signal: ctrl.signal,
    });
    if (!res.ok) throw await readError(res, 'OpenRouter');
    bump();
    if (!opts.onToken) {
      const c = (await res.json())?.choices?.[0]?.message?.content;
      if (!c) throw new Error('Tuščias atsakymas iš OpenRouter.');
      return c.trim();
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', full = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      bump();
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        if (payload === '[DONE]') return full;
        try {
          const j = JSON.parse(payload);
          if (j?.error) throw new Error(j.error.message || 'Teikėjo klaida');
          const d = j?.choices?.[0]?.delta?.content;
          if (d) { full += d; opts.onToken(d); }
        } catch (e) { if (e.message && !(e instanceof SyntaxError)) throw e; }
      }
    }
    if (!full.trim()) throw new Error('Tuščias atsakymas iš OpenRouter.');
    return full;
  } catch (err) {
    if (userAborted) throw userAbortError();
    if (err.name === 'AbortError') throw new Error('Užklausa nutraukta (laikas baigėsi).');
    if (err instanceof TypeError) throw new Error('Tinklo klaida. Patikrink interneto ryšį arba CORS.');
    throw err;
  } finally { clearTimeout(timer); }
}
async function callOllama(messages, signal) {
  const url = (state.settings.ollamaUrl || '').replace(/\/+$/, '');
  if (!url) throw new Error('Nenurodytas Ollama serverio URL.');
  const ctrl = new AbortController(); let userAborted = false;
  if (signal) signal.addEventListener('abort', () => { userAborted = true; ctrl.abort(); }, { once: true });
  const timer = setTimeout(() => ctrl.abort(), 120000);
  try {
    const res = await fetch(`${url}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ model: state.settings.ollamaModel, messages, stream:false, options:{temperature:.6} }), signal: ctrl.signal });
    if (!res.ok) throw await readError(res, 'Ollama');
    const c = (await res.json())?.message?.content;
    if (!c) throw new Error('Tuščias atsakymas iš Ollama.');
    return c.trim();
  } catch (err) {
    if (userAborted) throw userAbortError();
    if (err.name === 'AbortError') throw new Error('Užklausa nutraukta (120 s).');
    if (err instanceof TypeError) throw new Error('Nepavyksta prisijungti prie Ollama. Ar paleistas `ollama serve`? Nustatyk OLLAMA_ORIGINS=*.');
    throw err;
  } finally { clearTimeout(timer); }
}
function buildApiMessages(model, msgs) {
  return [{ role:'system', content: model.systemPrompt },
    ...msgs.filter(m => m.content && !m.error).slice(-14).map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: String(m.content).slice(0, 4000) }))];
}
const demoReply = (model, userText) => model.respond ? model.respond(userText || '') : pick(model.demoResponses);
async function callAI(model, chatMessages, signal) {
  const p = providerFor();
  if (p === 'demo') { await sleep(300); return demoReply(model, [...chatMessages].reverse().find(m => m.role === 'user')?.content); }
  const api = buildApiMessages(model, chatMessages);
  if (p === 'openrouter') return callOpenRouter(api, state.settings.openrouterModel, { signal, maxTokens: model.maxTokens });
  if (p === 'ollama') return callOllama(api, signal);
  throw new Error('Nepažįstamas teikėjas: ' + p);
}

/* ============ 9. TOAST / MODAL ============ */
function showToast(message, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icon(type === 'success' ? 'check' : type === 'error' ? 'alert' : 'sparkles', 14)}<span>${escapeHtml(message)}</span>`;
  $('#toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3400);
}
function closeModal() { $('#modalRoot').innerHTML = ''; document.removeEventListener('keydown', modalEsc); }
function modalEsc(e) { if (e.key === 'Escape') closeModal(); }
function openModal({ title, subtitle, bodyHTML, actions, onMount, wide }) {
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}" ${wide ? 'style="max-width:600px"' : ''}>
    <div class="modal-head"><div><h2>${escapeHtml(title)}</h2>${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ''}</div>
    <button class="modal-close" aria-label="Uždaryti">${icon('x', 16)}</button></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot">${actions.map(a => `<button class="btn ${a.cls || 'btn-secondary'}" data-action="${a.action}">${a.label}</button>`).join('')}</div></div>`;
  $('#modalRoot').appendChild(bd);
  document.addEventListener('keydown', modalEsc);
  bd.addEventListener('click', e => { if (e.target === bd) closeModal(); });
  $('.modal-close', bd).addEventListener('click', closeModal);
  bd.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => {
    const a = actions.find(x => x.action === btn.dataset.action); if (a?.onClick) a.onClick(bd);
  }));
  if (onMount) onMount(bd);
}
const confirmDialog = ({ title, message, confirmLabel = 'Patvirtinti', danger = false }) => new Promise(resolve => openModal({
  title, bodyHTML: `<p style="margin:0;color:var(--text2);font-size:14px">${escapeHtml(message)}</p>`,
  actions: [
    { label:'Atšaukti', action:'cancel', onClick: () => { closeModal(); resolve(false); } },
    { label: confirmLabel, action:'ok', cls: danger ? 'btn-danger' : 'btn-primary', onClick: () => { closeModal(); resolve(true); } }],
}));
const promptDialog = ({ title, subtitle, defaultValue = '' }) => new Promise(resolve => openModal({
  title, subtitle, bodyHTML: `<input type="text" class="modal-input" id="promptInput" value="${escapeHtml(defaultValue)}" maxlength="80" placeholder="Įveskite pavadinimą">`,
  actions: [
    { label:'Atšaukti', action:'cancel', onClick: () => { closeModal(); resolve(null); } },
    { label:'Išsaugoti', action:'ok', cls:'btn-primary', onClick: bd => { const v = $('#promptInput', bd).value.trim(); closeModal(); resolve(v || null); } }],
  onMount: bd => { const i = $('#promptInput', bd); i.focus(); i.select(); i.addEventListener('keydown', e => { if (e.key === 'Enter') { const v = i.value.trim(); closeModal(); resolve(v || null); } }); },
}));

/* ============ 11. ROBO BALSAS (naršyklės Web Speech API) ============
   Srautas: klausau → parodau tekstą → „galvoju“ (API) → gavęs atsakymą — perskaitau garsiai. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
const voice = { rec: null, listening: false, ltVoice: null, token: 0 };
function setRobot(st, text) {
  const stage = $('#voiceStage'); stage.dataset.state = st;
  const labels = { idle:'Paspausk mikrofoną ir kalbėk', listening:'Klausau...', thinking:'Galvoju...', speaking:'Kalbu...' };
  $('#voiceStatus').textContent = text || labels[st] || '';
  const mic = $('#micBtn');
  mic.classList.toggle('rec', st === 'listening');
  mic.innerHTML = svgIcon(st === 'listening' ? ICONS.stop : ICONS.mic, 24, 2);
  mic.setAttribute('aria-label', st === 'listening' ? 'Sustabdyti klausymą' : 'Kalbėti');
}
const setCaption = t => { $('#voiceCaption').textContent = t || ''; };
function pickLtVoice() { if (synth) voice.ltVoice = synth.getVoices().find(v => /^lt/i.test(v.lang)) || null; }
function stopSpeaking() { voice.token++; if (synth) synth.cancel(); }
function splitSpeech(text, max = 180) {
  const sentences = text.match(/[^.!?…\n]+[.!?…]*\s*/g) || [text];
  const chunks = []; let cur = '';
  for (const s of sentences) {
    if ((cur + s).length > max && cur) { chunks.push(cur.trim()); cur = ''; }
    cur += s;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}
function speak(text) {
  if (!state.settings.voiceOn || !synth) { setRobot('idle'); setCaption(''); return; }
  stopSpeaking();
  const clean = String(text).replace(/```[\s\S]*?```/g, ' ').replace(/[*_`#>~]/g, '').replace(/\s+/g, ' ').trim();
  if (!clean) { setRobot('idle'); return; }
  const token = voice.token, chunks = splitSpeech(clean);
  setCaption(clean);
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c);
    u.lang = 'lt-LT'; if (voice.ltVoice) u.voice = voice.ltVoice;
    if (i === 0) u.onstart = () => { if (token === voice.token) setRobot('speaking'); };
    const end = () => { if (token === voice.token && i === chunks.length - 1) setRobot('idle'); };
    u.onend = end; u.onerror = end;
    synth.speak(u);
  });
}
function toggleListening() {
  if (state.isGenerating) return;
  if (!SR) { showToast('Šioje naršyklėje nėra balso atpažinimo. Rašyk žinutę arba naudok Chrome / Edge.', 'error'); return; }
  if (voice.listening) { voice.rec && voice.rec.stop(); return; }
  stopSpeaking(); setCaption('');
  const rec = new SR();
  rec.lang = 'lt-LT'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = '';
  rec.onstart = () => { voice.listening = true; setRobot('listening'); };
  rec.onresult = e => {
    finalText = [...e.results].map(r => r[0].transcript).join('');
    setCaption('„' + finalText + '“');
  };
  rec.onerror = e => {
    const msg = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Mikrofonas neleidžiamas. Leisk jį naršyklės nustatymuose.'
      : e.error === 'no-speech' ? 'Nieko neišgirdau. Bandyk dar kartą.' : e.error === 'aborted' ? '' : 'Balso klaida: ' + e.error;
    if (msg) showToast(msg, 'error');
  };
  rec.onend = () => {
    voice.listening = false; voice.rec = null;
    const t = finalText.trim();
    if (t) { setCaption('„' + t + '“'); setRobot('thinking'); sendMessage(t); }
    else { setRobot('idle'); setCaption(''); }
  };
  voice.rec = rec;
  try { rec.start(); } catch { voice.listening = false; setRobot('idle'); }
}
function updateVoiceToggle() {
  const b = $('#voiceToggle'), on = state.settings.voiceOn;
  b.classList.toggle('off', !on); b.setAttribute('aria-pressed', on);
  $('span', b).textContent = on ? 'Balsas įjungtas' : 'Balsas išjungtas';
}
function updateStage() {
  const on = !!getModel(state.activeModelId).voice;
  $('#voiceStage').classList.toggle('on', on);
  if (!on) { stopSpeaking(); if (voice.rec) { try { voice.rec.abort(); } catch {} } }
  else { setRobot('idle'); setCaption(''); }
}

/* ============ 12. POKALBIŲ VALDYMAS ============ */
function createChat(modelId, title) {
  const chat = { id: uid(), modelId, title: truncate(title || 'Naujas pokalbis', 48), messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  state.chats.push(chat); saveChats(); return chat;
}
function deleteChat(id) {
  state.chats = state.chats.filter(c => c.id !== id);
  if (state.activeChatId === id) state.activeChatId = getChatsForModel(state.activeModelId)[0]?.id || null;
  saveChats();
}
function renameChat(id, title) {
  const c = state.chats.find(x => x.id === id); if (!c) return;
  c.title = truncate(title, 48); c.updatedAt = Date.now(); saveChats();
}
function busyGuard() { if (state.isGenerating) { showToast('Palauk, kol baigsiu atsakyti, arba paspausk stop', 'info'); return true; } return false; }
function switchModel(id) {
  if (busyGuard()) return;
  stopSpeaking();
  state.activeModelId = id;
  state.activeChatId = getChatsForModel(id)[0]?.id || null;
  $('#app').classList.remove('mobile-sidebar-open');
  applyModelAccent(getModel(id)); updateTopbar(); updateStage(); renderSidebar(); renderChat();
}
function newChat() {
  if (busyGuard()) return;
  state.activeChatId = null; $('#app').classList.remove('mobile-sidebar-open');
  renderSidebar(); renderChat(); if (!touchDevice()) setTimeout(() => $('#input').focus(), 60);
}
function openChat(id) {
  if (busyGuard()) return;
  const chat = state.chats.find(c => c.id === id); if (!chat) return;
  state.activeChatId = id;
  if (chat.modelId !== state.activeModelId) {
    state.activeModelId = chat.modelId; applyModelAccent(getModel(chat.modelId)); updateTopbar(); updateStage();
  }
  $('#app').classList.remove('mobile-sidebar-open'); renderSidebar(); renderChat();
}

/* ============ 13. RENDER ============ */
function renderSidebar() {
  const ml = $('#modelList'); ml.innerHTML = '';
  Object.values(MODELS).forEach(m => {
    const active = m.id === state.activeModelId;
    const btn = document.createElement('button');
    btn.className = 'model-item' + (active ? ' active' : '');
    btn.setAttribute('role', 'option'); btn.setAttribute('aria-selected', active);
    btn.style.setProperty('--m', m.accentRgb);
    btn.innerHTML = `<div class="model-avatar" style="background:${m.gradient}">${escapeHtml(m.avatar)}</div><div class="model-info"><b>${escapeHtml(m.name)}</b><span>${escapeHtml(m.tagline)}</span></div>`;
    btn.addEventListener('click', () => switchModel(m.id));
    ml.appendChild(btn);
  });
  const list = $('#chatList'); list.innerHTML = '';
  let chats = getChatsForModel(state.activeModelId);
  if (state.searchQuery) { const q = state.searchQuery.toLowerCase(); chats = chats.filter(c => c.title.toLowerCase().includes(q)); }
  if (!chats.length) {
    const e = document.createElement('div'); e.className = 'chat-empty';
    e.textContent = state.searchQuery ? 'Nieko nerasta pagal paiešką.' : 'Dar nėra pokalbių. Pradėk naują!';
    list.appendChild(e); return;
  }
  chats.forEach(chat => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (chat.id === state.activeChatId ? ' active' : '');
    item.setAttribute('role', 'button'); item.tabIndex = 0;
    item.innerHTML = `<span class="chat-title">${escapeHtml(chat.title)}</span><button class="chat-menu-btn" aria-label="Pokalbio meniu">${icon('more', 14)}</button>`;
    item.addEventListener('click', e => { if (!e.target.closest('.chat-menu-btn')) openChat(chat.id); });
    item.addEventListener('keydown', e => { if (e.target === item && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openChat(chat.id); } });
    $('.chat-menu-btn', item).addEventListener('click', e => { e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(); showChatContextMenu(r.right, r.bottom, chat); });
    list.appendChild(item);
  });
}
function updateTopbar() {
  const m = getModel(state.activeModelId), a = $('#topAvatar');
  a.textContent = m.avatar; a.style.background = m.gradient;
  $('#topName').textContent = m.name; $('#topStatus').textContent = m.tagline;
}
function renderChat() {
  const chat = getActiveChat();
  if (!chat || !chat.messages.length) { renderWelcome(); return; }
  const model = getModel(chat.modelId || state.activeModelId);
  const el = document.createElement('div'); el.className = 'messages'; el.id = 'messages';
  chat.messages.forEach(m => el.appendChild(buildMessageEl(m, model)));
  const inner = $('#chatInner'); inner.innerHTML = ''; inner.appendChild(el);
  requestAnimationFrame(() => scrollToBottom(false));
}
function renderWelcome() {
  const m = getModel(state.activeModelId), inner = $('#chatInner');
  inner.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'welcome';
  wrap.innerHTML = `
    <div class="welcome-hero"><div class="welcome-badge">${icon('sparkles', 12)}<span>${escapeHtml(m.tagline)}</span></div>
      <h1>Sveiki atvykę pas ${escapeHtml(m.name)}</h1><p>${escapeHtml(m.welcome)}</p></div>
    <div class="w-title">${m.voice ? 'Ką galima daryti' : 'Mokymosi sritys'}</div>
    <div class="category-grid">${m.categories.map(c => `<button class="category-card" data-category="${escapeHtml(c.title)}"><div class="category-icon">${catIcon(c.icon)}</div><b>${escapeHtml(c.title)}</b><span>${escapeHtml(c.desc)}</span></button>`).join('')}</div>
    <div class="w-title">Greitos užduotys</div>
    <div class="quick-list">${m.quick.map(q => `<button class="quick-chip" data-quick="${escapeHtml(q)}">${icon('sparkles', 13)}<span>${escapeHtml(q)}</span></button>`).join('')}</div>`;
  inner.appendChild(wrap);
  const roboMap = { 'Pasisveikinimas':'Labas!', 'Kaip sekasi?':'Kaip sekasi?', 'Ką moki?':'Ką tu moki?' };
  wrap.querySelectorAll('.category-card').forEach(c => c.addEventListener('click', () => {
    const t = c.dataset.category;
    if (m.voice) { t === 'Balsu' ? toggleListening() : sendMessage(roboMap[t] || 'Labas!'); }
    else sendMessage(`Noriu sužinoti daugiau apie ${t}. Paaiškink pagrindus.`);
  }));
  wrap.querySelectorAll('.quick-chip').forEach(c => c.addEventListener('click', () => sendMessage(c.dataset.quick)));
}
function buildMessageEl(msg, model, fresh = false) {
  const el = document.createElement('div');
  el.className = 'msg ' + msg.role + (fresh ? ' fresh' : ''); el.dataset.msgId = msg.id;
  if (msg.role === 'ai') {
    el.innerHTML = `<div class="msg-avatar" style="background:${model.gradient}">${escapeHtml(model.avatar)}</div>
      <div class="msg-body"><div class="msg-head"><b>${escapeHtml(model.name)}</b><span class="msg-time">${formatTime(msg.timestamp)}</span></div>
      <div class="msg-content">${renderMarkdown(msg.content)}</div>
      <div class="msg-actions"><button class="msg-action" data-act="copy">${icon('copy', 12)} Kopijuoti</button><button class="msg-action" data-act="regen">${icon('refresh', 12)} Generuoti iš naujo</button></div></div>`;
  } else {
    el.innerHTML = `<div class="msg-body"><div class="msg-head"><span class="msg-time">${formatTime(msg.timestamp)}</span></div><div class="msg-content">${escapeHtml(msg.content)}</div></div>`;
  }
  el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => b.dataset.act === 'copy' ? copyToClipboard(msg.content, 'Atsakymas nukopijuotas') : regenerateMessage(msg.id)));
  el.querySelectorAll('.code-copy').forEach(b => b.addEventListener('click', () => copyToClipboard(decodeURIComponent(b.dataset.code || ''), 'Kodas nukopijuotas')));
  return el;
}
const scrollToBottom = (smooth = true) => { const a = $('#chatArea'); if (a) a.scrollTo({ top: a.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); };
const isNearBottom = () => { const a = $('#chatArea'); return !a || a.scrollHeight - a.scrollTop - a.clientHeight < 140; };

/* ============ 14. SIUNTIMAS ============ */
async function sendMessage(rawText) {
  const text = (rawText != null ? rawText : $('#input').value).trim();
  if (!text || state.isGenerating) return;
  stopSpeaking();

  let chat = getActiveChat();
  if (!chat) { chat = createChat(state.activeModelId, text); state.activeChatId = chat.id; }
  const model = getModel(chat.modelId || state.activeModelId);

  const userMsg = { id: uid(), role:'user', content:text, timestamp:Date.now() };
  chat.messages.push(userMsg); chat.updatedAt = Date.now();
  if (chat.messages.filter(m => m.role === 'user').length === 1) chat.title = truncate(text, 48);
  saveChats();
  $('#input').value = ''; autoResizeInput();

  if (!$('#messages')) renderChat();
  else { $('#messages').appendChild(buildMessageEl(userMsg, model)); }
  scrollToBottom();
  renderSidebar();

  state.isGenerating = true; state.controller = new AbortController();
  updateSendState(); showTyping();
  if (model.voice) { setRobot('thinking'); if (!$('#voiceCaption').textContent) setCaption('„' + text + '“'); }

  const aiMsg = { id: uid(), role:'ai', content:'', timestamp:Date.now(), modelId: model.id };
  let msgEl = null, contentEl = null, pending = false;

  const ensureMsgEl = () => {
    if (msgEl) return;
    hideTyping();
    msgEl = document.createElement('div'); msgEl.className = 'msg ai streaming'; msgEl.dataset.msgId = aiMsg.id;
    msgEl.innerHTML = `<div class="msg-avatar" style="background:${model.gradient}">${escapeHtml(model.avatar)}</div>
      <div class="msg-body"><div class="msg-head"><b>${escapeHtml(model.name)}</b><span class="msg-time">${formatTime(aiMsg.timestamp)}</span></div><div class="msg-content"></div></div>`;
    contentEl = $('.msg-content', msgEl);
    $('#messages')?.appendChild(msgEl);
  };
  const scheduleRender = () => {
    if (pending) return; pending = true;
    requestAnimationFrame(() => {
      pending = false; if (!msgEl || !contentEl) return;
      contentEl.innerHTML = renderMarkdown(aiMsg.content, true) + '<span class="stream-cursor"></span>';
      if (isNearBottom()) scrollToBottom(false);
    });
  };
  /* Sklandus teksto atskleidimas (demo ir Ollama, kurie negrąžina streaming). */
  const reveal = async full => {
    ensureMsgEl();
    for (const chunk of full.match(/[\s\S]{1,5}/g) || []) {
      if (state.controller.signal.aborted) throw userAbortError();
      aiMsg.content += chunk; scheduleRender(); await sleep(14);
    }
  };
  const finish = () => {
    hideTyping();
    if (!aiMsg.content.trim()) { msgEl?.remove(); return false; }
    ensureMsgEl();
    chat.messages.push(aiMsg); chat.updatedAt = Date.now(); saveChats();
    msgEl.replaceWith(buildMessageEl(aiMsg, model, true));
    renderSidebar(); if (isNearBottom()) scrollToBottom();
    return true;
  };

  try {
    const provider = providerFor();
    const api = buildApiMessages(model, chat.messages);
    if (provider === 'openrouter') {
      await callOpenRouter(api, state.settings.openrouterModel, {
        signal: state.controller.signal, maxTokens: model.maxTokens,
        onToken: tok => { ensureMsgEl(); aiMsg.content += tok; scheduleRender(); },
      });
    } else if (provider === 'ollama') {
      await reveal(await callOllama(api, state.controller.signal));
    } else {
      await sleep(model.voice ? 600 : 250);
      await reveal(demoReply(model, text));
    }
    if (!aiMsg.content.trim()) throw new Error('Tuščias atsakymas.');
    finish();
    if (model.voice) speak(aiMsg.content);
  } catch (err) {
    if (err.userAbort) {
      finish();
      if (model.voice) { setRobot('idle'); setCaption(''); }
    } else {
      console.error('AI klaida:', err);
      const partial = aiMsg.content.trim();
      aiMsg.content = (partial ? partial + '\n\n' : '') + `**Klaida generuojant atsakymą.**\n\n\`${err.message}\`\n\nPatikrink Nustatymuose:\n- ar teisingas API raktas (OpenRouter),\n- ar modelis egzistuoja ir turi prieigą,\n- ar paleistas Ollama (jei naudoji vietinį režimą).\n\nGali perjungti į **Demo režimą** Nustatymuose.`;
      aiMsg.error = true;
      finish();
      if (model.voice) { setRobot('idle'); setCaption('Atsiprašau, įvyko klaida.'); }
      showToast('AI klaida: ' + err.message.slice(0, 100), 'error');
    }
  } finally {
    state.isGenerating = false; state.controller = null; updateSendState();
    if (!touchDevice() && !model.voice) $('#input').focus();
  }
}
function showTyping() {
  const model = getModel(state.activeModelId), box = $('#messages'); if (!box) return;
  const el = document.createElement('div'); el.className = 'msg ai typing'; el.id = 'typingIndicator';
  el.innerHTML = `<div class="msg-avatar" style="background:${model.gradient}">${escapeHtml(model.avatar)}</div><div class="msg-body"><div class="msg-head"><b>${escapeHtml(model.name)}</b></div><div class="msg-content"><i></i><i></i><i></i></div></div>`;
  box.appendChild(el); if (isNearBottom()) scrollToBottom();
}
const hideTyping = () => $('#typingIndicator')?.remove();
function stopGenerating() { if (state.controller) state.controller.abort(); }

async function regenerateMessage(messageId) {
  if (busyGuard()) return;
  const chat = getActiveChat(); if (!chat) return;
  const idx = chat.messages.findIndex(m => m.id === messageId);
  if (idx < 1) return;
  const aiMsg = chat.messages[idx];
  if (aiMsg.role !== 'ai' || chat.messages[idx - 1].role !== 'user') return;
  const model = getModel(aiMsg.modelId || chat.modelId || state.activeModelId);
  const swap = fresh => { const el = document.querySelector(`[data-msg-id="${messageId}"]`); if (el) el.replaceWith(buildMessageEl(aiMsg, model, fresh)); };

  state.isGenerating = true; state.controller = new AbortController(); updateSendState();
  stopSpeaking();
  const old = { content: aiMsg.content, error: aiMsg.error };
  aiMsg.content = '*(generuojama iš naujo...)*'; aiMsg.error = true; swap(false);
  let ok = false;
  try {
    aiMsg.content = await callAI(model, chat.messages.slice(0, idx), state.controller.signal);
    aiMsg.error = false; aiMsg.timestamp = Date.now(); chat.updatedAt = Date.now(); saveChats(); ok = true;
  } catch (err) {
    aiMsg.content = old.content; aiMsg.error = old.error;
    if (!err.userAbort) showToast('Nepavyko pergeneruoti: ' + err.message.slice(0, 100), 'error');
  } finally {
    state.isGenerating = false; state.controller = null; updateSendState(); swap(ok);
    if (ok && model.voice && model.id === state.activeModelId) speak(aiMsg.content);
  }
}

/* ============ 15. KOPIJAVIMAS ============ */
async function copyToClipboard(text, ok = 'Nukopijuota') {
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    showToast(ok, 'success');
  } catch { showToast('Nepavyko nukopijuoti', 'error'); }
}

/* ============ 16. ĮVESTIS ============ */
function autoResizeInput() { const i = $('#input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 200) + 'px'; }
function updateSendState() {
  const has = $('#input').value.trim().length > 0, s = $('#sendBtn'), g = state.isGenerating;
  s.disabled = !g && !has;
  s.classList.toggle('busy', g);
  s.setAttribute('aria-label', g ? 'Sustabdyti' : 'Siųsti'); s.title = g ? 'Sustabdyti' : 'Siųsti';
  $('#clearBtn').classList.toggle('visible', has && !g);
  $('#micBtn').disabled = g;
}

/* ============ 17. KONTEKSTINIS MENIU ============ */
let ctxMenu = null;
const closeContextMenu = () => { ctxMenu?.remove(); ctxMenu = null; };
function showChatContextMenu(x, y, chat) {
  closeContextMenu();
  const menu = document.createElement('div'); menu.className = 'context-menu';
  menu.innerHTML = `<button data-ctx="rename">${icon('pencil', 14)} Pervadinti</button><button data-ctx="delete" class="danger">${icon('trash', 14)} Ištrinti</button>`;
  document.body.appendChild(menu); ctxMenu = menu;
  const r = menu.getBoundingClientRect();
  let px = x - r.width, py = y + 4;
  if (px < 8) px = x + 4;
  if (py + r.height > innerHeight - 8) py = y - r.height - 4;
  menu.style.left = px + 'px'; menu.style.top = py + 'px';
  $('[data-ctx=rename]', menu).addEventListener('click', async () => {
    closeContextMenu();
    const t = await promptDialog({ title:'Pervadinti pokalbį', subtitle:'Įvesk naują pavadinimą', defaultValue: chat.title });
    if (t) { renameChat(chat.id, t); renderSidebar(); showToast('Pokalbis pervadintas', 'success'); }
  });
  $('[data-ctx=delete]', menu).addEventListener('click', async () => {
    closeContextMenu();
    if (await confirmDialog({ title:'Ištrinti pokalbį?', message:`„${chat.title}“ bus negrįžtamai pašalintas.`, confirmLabel:'Ištrinti', danger:true })) {
      deleteChat(chat.id); renderSidebar(); renderChat(); showToast('Pokalbis ištrintas', 'success');
    }
  });
  setTimeout(() => document.addEventListener('click', closeContextMenu, { once: true }), 0);
}

/* ============ 18. INIT ============ */
function renderAll() {
  $('#app').classList.toggle('sidebar-collapsed', state.settings.sidebarCollapsed);
  applyModelAccent(getModel(state.activeModelId));
  updateTopbar(); updateStage(); updateProviderPill(); updateVoiceToggle(); renderSidebar(); renderChat(); updateSendState();
}
function seedDemoData() {
  if (localStorage.getItem(STORAGE.seeded)) return;
  try { localStorage.setItem(STORAGE.seeded, '1'); } catch {}
  if (state.chats.length) return;
  const now = Date.now();
  state.chats.push({ id: uid(), modelId:'atlas', title:'Pitagoro teorema', createdAt: now - 480000, updatedAt: now - 450000, messages: [
    { id: uid(), role:'user', content:'Paaiškink Pitagoro teoremą', timestamp: now - 480000 },
    { id: uid(), role:'ai', modelId:'atlas', timestamp: now - 450000, content: MODELS.atlas.demoResponses[0] }] });
  saveChats();
}
function init() {
  loadState(); seedDemoData();
  applyTheme(); applyReducedMotion();
  state.activeChatId = getChatsForModel(state.activeModelId)[0]?.id || null;
  if (synth) { pickLtVoice(); synth.addEventListener?.('voiceschanged', pickLtVoice); }
  renderAll();

  $('#sidebarCollapse').addEventListener('click', () => { state.settings.sidebarCollapsed = !state.settings.sidebarCollapsed; $('#app').classList.toggle('sidebar-collapsed', state.settings.sidebarCollapsed); saveSettings(); });
  $('#mobileMenuBtn').addEventListener('click', () => $('#app').classList.add('mobile-sidebar-open'));
  $('#overlay').addEventListener('click', () => $('#app').classList.remove('mobile-sidebar-open'));
  $('#newChatBtn').addEventListener('click', newChat);
  $('#chatSearch').addEventListener('input', e => { state.searchQuery = e.target.value.trim(); renderSidebar(); });
  $('#themeToggle').addEventListener('click', () => { state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; applyTheme(); saveSettings(); });
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#micBtn').addEventListener('click', toggleListening);
  $('#voiceToggle').addEventListener('click', () => {
    state.settings.voiceOn = !state.settings.voiceOn;
    if (!state.settings.voiceOn) { stopSpeaking(); if (!state.isGenerating && !voice.listening) { setRobot('idle'); setCaption(''); } }
    updateVoiceToggle(); saveSettings();
  });

  const input = $('#input');
  input.addEventListener('input', () => { autoResizeInput(); updateSendState(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!state.isGenerating) sendMessage(); } });
  $('#sendBtn').addEventListener('click', () => state.isGenerating ? stopGenerating() : sendMessage());
  $('#clearBtn').addEventListener('click', () => { input.value = ''; autoResizeInput(); updateSendState(); input.focus(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      $('#app').classList.remove('mobile-sidebar-open'); closeContextMenu();
      if (state.isGenerating && !$('#modalRoot').children.length) stopGenerating();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); (state.settings.sidebarCollapsed ? input : $('#chatSearch')).focus(); }
  });
  window.addEventListener('beforeunload', stopSpeaking);
  setTimeout(() => { if (!touchDevice() && !getModel(state.activeModelId).voice) input.focus(); }, 100);
}
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();
</script>
